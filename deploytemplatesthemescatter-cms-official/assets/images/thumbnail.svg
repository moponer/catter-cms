<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#2563EB"/>
  
  <!-- 渐变效果 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grad1)"/>
  
  <!-- Logo图标 -->
  <circle cx="200" cy="130" r="50" fill="white" opacity="0.9"/>
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#2563EB" text-anchor="middle">C</text>
  
  <!-- 标题 -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Catter CMS</text>
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.8" text-anchor="middle">Official Theme</text>
  
  <!-- 装饰元素 -->
  <circle cx="50" cy="50" r="20" fill="white" opacity="0.1"/>
  <circle cx="350" cy="250" r="30" fill="white" opacity="0.1"/>
</svg>