# Catter CMS 配置文件
# 环境: development (开发环境) / production (生产环境)
env: development

server:
  port: "3000"
  host: "0.0.0.0"
  mode: debug
  # theme_path: "./templates/themes"  # 可选，不配置则自动检测

database:
  driver: "sqlite"
  database: "catter.db"

jwt:
  # 本地开发用的密钥，禁止用于生产环境
  # 生产环境必须通过环境变量 JWT_SECRET 覆盖！
  secret: "change-me-to-a-random-32-char-secret"
  expire: 24

upload:
  max_size: 10485760  # 10MB
  path: "uploads"
  allowed_ext: ".jpg,.jpeg,.png,.gif,.webp,.svg,.pdf,.doc,.docx"
  # 图片压缩设置
  image_compress: true   # 是否启用图片压缩（默认 true）
  max_width: 1920        # 图片最大宽度，超宽自动缩放（默认 1920px）
  jpeg_quality: 85       # JPEG 压缩质量 60-100，越高越清晰文件越大（默认 85）

# ==========================================
# 存储配置（对象存储）
# ==========================================
# type: local（本地存储，默认）
# type: qiniu（七牛云）
# type: alioss（阿里云 OSS）
# type: tencentcos（腾讯云 COS）
# type: s3（AWS S3 / Cloudflare R2 / MinIO）
# storage:
#   type: "local"
#   # ----- 七牛云 -----
#   qiniu:
#     access_key: ""
#     secret_key: ""
#     bucket: ""
#     zone: "huadong"      # huadong, huabei, huanan, beimei, xinjiaopo
#     domain: ""           # CDN 域名（如 cdn.example.com）
#     use_https: true
#   # ----- 阿里云 OSS -----
#   alioss:
#     endpoint: ""          # 如 https://oss-cn-hangzhou.aliyuncs.com
#     access_key_id: ""
#     access_key_secret: ""
#     bucket: ""
#     custom_domain: ""     # 可选 CDN 域名
#   # ----- 腾讯云 COS -----
#   tencentcos:
#     bucket_url: ""        # 如 https://bucket-1234567890.cos.ap-guangzhou.myqcloud.com
#     secret_id: ""
#     secret_key: ""
#     region: ""            # 如 ap-guangzhou
#     custom_domain: ""     # 可选（如 Cloudflare R2 公开域名）
#   # ----- AWS S3 / 兼容存储 -----
#   s3:
#     endpoint: ""          # 如 https://s3.amazonaws.com 或 MinIO 地址
#     region: ""            # 如 us-east-1
#     access_key_id: ""
#     secret_access_key: ""
#     bucket: ""
#     force_path_style: false  # MinIO 设为 true
#     custom_domain: ""     # 可选（如 Cloudflare R2 公开域名）

# ==========================================
# Redis 缓存配置
# ==========================================
redis:
  enabled: false          # 是否启用 Redis 缓存
  host: "127.0.0.1"       # Redis 地址
  port: 6379              # Redis 端口
  password: ""            # Redis 密码（留空表示无密码）
  db: 0                   # 数据库编号
  key_prefix: "catter:"   # Key 前缀

security:
  # CORS 允许的来源，为空则允许所有
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  # Content-Security-Policy，如果 enable_csp 为 true 则生效
  # csp: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
  enable_csp: false

# ==========================================
# 部署说明
# ==========================================
#
# 开发环境:
#   直接运行: go run ./gin-app/cmd/main.go
#   配置文件: config.yaml
#
# 生产环境:
#   设置环境变量:
#     export APP_ENV=production
#     export GIN_MODE=release
#     export JWT_SECRET=your-super-secure-32-char-minimum-secret-key
#     export SERVER_PORT=3000
#   或创建生产配置文件 /etc/catter-cms/config.yaml:
#     env: production
#     server:
#       port: "3000"
#       mode: release
#     jwt:
#       secret: your-super-secure-32-char-minimum-secret-key
