<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= page.Title %> - <%= config.siteTitle %></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #2d3436;
            background: #ffffff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Navigation */
        nav {
            background: #2d3436;
            padding: 16px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }
        
        nav .logo {
            font-size: 1.4em;
            font-weight: 700;
            color: #ffffff;
        }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
        }
        
        nav a {
            text-decoration: none;
            color: #dfe6e9;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        nav a:hover {
            color: #e17055;
        }
        
        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 30px;
        }
        
        /* Page Content */
        .page-content {
            background: #ffffff;
            padding: 50px;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
        }
        
        .page-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e17055;
        }
        
        .page-header h1 {
            font-size: 2em;
            color: #2d3436;
            margin-bottom: 10px;
        }
        
        .page-meta {
            color: #636e72;
            font-size: 0.9em;
        }
        
        .page-meta span {
            margin-right: 15px;
        }
        
        .page-body {
            font-size: 1.05em;
            line-height: 1.8;
        }
        
        .page-body h2 {
            font-size: 1.5em;
            margin: 30px 0 15px;
            color: #2d3436;
            border-left: 4px solid #e17055;
            padding-left: 16px;
        }
        
        .page-body h3 {
            font-size: 1.3em;
            margin: 25px 0 12px;
            color: #2d3436;
        }
        
        .page-body p {
            margin-bottom: 15px;
        }
        
        .page-body ul, .page-body ol {
            margin: 15px 0;
            padding-left: 25px;
        }
        
        .page-body li {
            margin-bottom: 8px;
        }
        
        .page-body a {
            color: #e17055;
            text-decoration: none;
        }
        
        .page-body a:hover {
            text-decoration: underline;
        }
        
        .page-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .page-body blockquote {
            border-left: 4px solid #e17055;
            padding: 15px 20px;
            margin: 20px 0;
            background: #f8f9fa;
        }
        
        .page-body code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
        }
        
        .page-body pre {
            background: #2d3436;
            color: #dfe6e9;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }
        
        .page-body pre code {
            background: none;
            padding: 0;
        }
        
        /* Sidebar */
        .sidebar {
            display: block;
        }
        
        .widget {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .widget h4 {
            font-size: 1em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e17055;
            color: #2d3436;
        }
        
        .widget ul {
            list-style: none;
        }
        
        .widget li {
            padding: 8px 0;
            border-bottom: 1px solid #dfe6e9;
        }
        
        .widget li:last-child {
            border-bottom: none;
        }
        
        .widget a {
            color: #636e72;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .widget a:hover {
            color: #e17055;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            color: #636e72;
            margin-top: 40px;
            border-top: 1px solid #dfe6e9;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .page-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <a href="/" class="logo"><%= config.siteTitle %></a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/blog">文章</a>
                <a href="/categories">分类</a>
                <a href="/tags">标签</a>
            </div>
        </nav>
        
        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Page Content -->
            <main class="page-content">
                <header class="page-header">
                    <h1><%= page.Title %></h1>
                    <div class="page-meta">
                        <span><%= page.PublishedAt %></span>
                        <%= if (page.Author) { %>
                        <span><%= page.Author.Name %></span>
                        <% } %>
                    </div>
                </header>
                
                <div class="page-body">
                    <%= page.Content %>
                </div>
            </main>
            
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="widget">
                    <h4>搜索</h4>
                    <form action="/search" method="get">
                        <input type="text" name="q" placeholder="搜索文章..." style="width:100%;padding:10px;border:1px solid #dfe6e9;border-radius:6px;">
                    </form>
                </div>
                
                <div class="widget">
                    <h4>最近文章</h4>
                    <ul>
                        <%= for (post) in recentPosts { %>
                        <li><a href="/blog/<%= post.Slug %>"><%= post.Title %></a></li>
                        <% } %>
                    </ul>
                </div>
            </aside>
        </div>
        
        <!-- Footer -->
        <footer>
            <p>&copy; 2026 <%= config.siteTitle %>. Powered by Catter CMS</p>
        </footer>
    </div>
</body>
</html>
