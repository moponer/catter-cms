<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= category.Name %> - <%= site["title"] %></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background: linear-gradient(135deg, #667eea 0%, #764ba4 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav .logo {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #3B82F6, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #4b5563;
            font-weight: 500;
        }
        
        .category-header {
            background: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .category-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .category-header p {
            color: #6b7280;
        }
        
        .posts-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .post-card {
            padding: 25px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .post-card:last-child {
            border-bottom: none;
        }
        
        .post-card h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }
        
        .post-card h3 a {
            color: #1f2937;
            text-decoration: none;
        }
        
        .post-card h3 a:hover {
            color: #3B82F6;
        }
        
        .post-meta {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .post-excerpt {
            color: #4b5563;
        }
        
        footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            text-align: center;
            margin-top: 40px;
            border-radius: 15px;
        }
        
        footer p {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">Catter Blog</div>
            <div>
                <a href="/">首页</a>
                <a href="/blog">博客</a>
                <a href="/about">关于</a>
            </div>
        </nav>
        
        <header class="category-header">
            <h1>📂 <%= category.Name %></h1>
            <p>该分类下共 <%= len(posts) %> 篇文章</p>
        </header>
        
        <main class="posts-section">
            <%= for (post) in posts { %>
            <article class="post-card">
                <h3><a href="/blog/<%= post.Slug %>"><%= post.Title %></a></h3>
                <div class="post-meta">
                    <span>📅 <%= post.PublishedAt %></span>
                </div>
                <p class="post-excerpt"><%= post.Excerpt %></p>
            </article>
            <% } %>
        </main>
        
        <footer>
            <p>&copy; 2026 <%= site["title"] %>. Powered by Catter CMS</p>
        </footer>
    </div>
</body>
</html>
