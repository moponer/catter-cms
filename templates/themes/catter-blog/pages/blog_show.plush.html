<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= post.Title %> - <%= site["title"] %></title>
    <meta name="description" content="<%= post.Excerpt %>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.8;
            color: #1f2937;
            background: linear-gradient(135deg, #667eea 0%, #764ba4 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav .logo {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #3B82F6, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #4b5563;
            font-weight: 500;
        }
        
        .article-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #3B82F6;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .article-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .article-header h1 {
            font-size: 2.5em;
            line-height: 1.3;
            margin-bottom: 20px;
            color: #111827;
        }
        
        .article-meta {
            display: flex;
            gap: 20px;
            color: #6b7280;
            font-size: 0.95em;
        }
        
        .article-content {
            font-size: 1.1em;
            line-height: 2;
        }
        
        .article-content h2 {
            margin: 40px 0 20px;
            font-size: 1.8em;
            color: #111827;
        }
        
        .article-content h3 {
            margin: 30px 0 15px;
            font-size: 1.4em;
            color: #111827;
        }
        
        .article-content p {
            margin-bottom: 20px;
        }
        
        .article-content pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 20px 0;
        }
        
        .article-content code {
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
        }
        
        .article-content blockquote {
            border-left: 4px solid #3B82F6;
            padding-left: 20px;
            margin: 20px 0;
            color: #6b7280;
            font-style: italic;
        }
        
        .article-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .article-footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #e5e7eb;
        }
        
        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .tag {
            background: #f3f4f6;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #4b5563;
            text-decoration: none;
        }
        
        .tag:hover {
            background: #3B82F6;
            color: white;
        }
        
        footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            text-align: center;
            margin-top: 40px;
            border-radius: 15px;
        }
        
        footer p {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">Catter Blog</div>
            <div>
                <a href="/">首页</a>
                <a href="/blog">博客</a>
                <a href="/about">关于</a>
            </div>
        </nav>
        
        <article class="article-container">
            <a href="/" class="back-link">← 返回首页</a>
            
            <header class="article-header">
                <h1><%= post.Title %></h1>
                <div class="article-meta">
                    <span>📅 <%= post.PublishedAt %></span>
                    <span>👁 <%= post.Views %> 阅读</span>
                    <span>⏱ 阅读约 <%= post.ReadingTime %> 分钟</span>
                </div>
            </header>
            
            <div class="article-content">
                <%= post.Content %>
            </div>
            
            <footer class="article-footer">
                <div class="tags">
                    <span style="color: #6b7280; margin-right: 10px;">标签:</span>
                    <a href="/tag/example" class="tag">技术</a>
                    <a href="/tag/example" class="tag">编程</a>
                </div>
            </footer>
        </article>
        
        <footer>
            <p>&copy; 2026 <%= site["title"] %>. Powered by Catter CMS</p>
        </footer>
    </div>
</body>
</html>
