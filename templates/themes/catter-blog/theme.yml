# ========================================
# Catter Blog 主题配置文件
# 版本: 2.1.0 (精简版)
# ========================================

# 基础信息
name: "Catter Blog"
version: "2.1.0"
apiVersion: "2.0"
description: "现代化的博客主题，支持响应式设计和模块化配置"
author: "Catter Team"
authorEmail: "support@cattercms.com"
authorUrl: "https://cattercms.com"
license: "MIT"
tags: ["blog", "responsive", "clean", "minimal"]

# 主题预览
screenshots:
  - "assets/images/screenshot1.jpg"
  - "assets/images/screenshot2.jpg"
  - "assets/images/screenshot3.jpg"
thumbnail: "assets/images/thumbnail.svg"

# 依赖要求
requires:
  buffalo: ">=0.18.0"
  catterCms: ">=2.0.0"

# 主题能力声明
capabilities:
  layouts: [default, blog, fullwidth, landing]
  modules: [hero, features, posts, sidebar, related-posts, author-info]
  widgets: [search, categories, tags, recent-posts, author-info, custom-html]
  postFormats: [standard, gallery, video, audio]
  customFields: true
  customTemplates: true
  colorSchemes: true
  darkMode: false

# ========================================
# 默认配置
# ========================================
config:
  # 外观配置
  appearance:
    colors:
      primary: "#2d3436"
      secondary: "#636e72"
      accent: "#e17055"
    typography:
      baseFont: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    layout:
      width: "1200px"
      sidebar: "right"

  # Hero模块
  modules:
    hero:
      enabled: true
      config:
        title: "欢迎来到我的博客"
        subtitle: "分享技术、记录生活、探索未知"
        backgroundType: "color"
        backgroundColor: "#2d3436"
        ctaText: "查看文章"
        ctaUrl: "/article"
        showCta: true

  # 博主信息
  widgets:
    author:
      enabled: true
      title: "关于博主"
      name: "博主"
      bio: "热爱技术，热爱生活"
      showSocial: true

  # 自定义代码
  custom:
    css: ""
    js: ""

# ========================================
# 配置定义(用于生成管理后台配置表单)
# ========================================
configDefinition:
  # 外观配置
  - section: "外观"
    icon: "palette"
    description: "配置主题颜色、字体、布局等外观设置"
    fields:
      - name: "appearance.colors.primary"
        label: "主色调"
        type: "color"
        showAlpha: false
        default: "#2d3436"
        description: "网站的主色调，影响导航、标题等元素"

      - name: "appearance.colors.secondary"
        label: "次要颜色"
        type: "color"
        showAlpha: false
        default: "#636e72"
        description: "次要文字和装饰元素的颜色"

      - name: "appearance.colors.accent"
        label: "强调色"
        type: "color"
        showAlpha: false
        default: "#e17055"
        description: "用于按钮、链接悬停等强调元素"

      - name: "appearance.typography.baseFont"
        label: "基础字体"
        type: "select"
        options:
          - label: "系统字体"
            value: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          - label: "Noto Sans SC"
            value: "'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        default: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

      - name: "appearance.layout.width"
        label: "内容宽度"
        type: "text"
        placeholder: "例如: 1200px, 90%"
        default: "1200px"
        description: "网站内容区域的最大宽度"

  # Hero模块
  - section: "Hero模块"
    icon: "view"
    description: "配置网站顶部Hero区域"
    fields:
      - name: "modules.hero.enabled"
        label: "启用Hero模块"
        type: "switch"
        default: true

      - name: "modules.hero.config.title"
        label: "主标题"
        type: "text"
        default: "欢迎来到我的博客"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.subtitle"
        label: "副标题"
        type: "textarea"
        default: "分享技术、记录生活、探索未知"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.backgroundType"
        label: "背景类型"
        type: "select"
        options:
          - label: "纯色"
            value: "color"
          - label: "渐变"
            value: "gradient"
          - label: "图片"
            value: "image"
        default: "color"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.backgroundColor"
        label: "背景颜色"
        type: "color"
        showAlpha: false
        default: "#2d3436"
        show_if: "modules.hero.enabled && modules.hero.config.backgroundType == 'color'"

      - name: "modules.hero.config.showCta"
        label: "显示按钮"
        type: "switch"
        default: true
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.ctaText"
        label: "按钮文本"
        type: "text"
        default: "查看文章"
        show_if: "modules.hero.enabled && modules.hero.config.showCta"

      - name: "modules.hero.config.ctaUrl"
        label: "按钮链接"
        type: "text"
        default: "/article"
        placeholder: "例如: /article, /page/about"
        description: "点击按钮后跳转的目标地址"
        show_if: "modules.hero.enabled && modules.hero.config.showCta"

  # 博主信息
  - section: "博主信息"
    icon: "user"
    description: "配置侧边栏博主信息"
    fields:
      - name: "widgets.author.enabled"
        label: "启用博主信息"
        type: "switch"
        default: true

      - name: "widgets.author.name"
        label: "博主名称"
        type: "text"
        default: "博主"
        show_if: "widgets.author.enabled"

      - name: "widgets.author.bio"
        label: "个人简介"
        type: "textarea"
        default: "热爱技术，热爱生活"
        show_if: "widgets.author.enabled"

  # 自定义代码
  - section: "自定义代码"
    icon: "code"
    description: "添加自定义CSS和JavaScript代码"
    fields:
      - name: "custom.css"
        label: "自定义CSS"
        type: "code"
        language: "css"
        rows: 8
        placeholder: "/* 自定义样式 */"

      - name: "custom.js"
        label: "自定义JavaScript"
        type: "code"
        language: "javascript"
        rows: 8
        placeholder: "// 自定义脚本"

# 菜单位置定义
menuLocations:
  header:
    name: "顶部导航"
    description: "网站顶部主导航菜单"
    maxDepth: 3
  footer:
    name: "底部导航"
    description: "网站底部导航菜单"
    maxDepth: 2

# 小工具区域定义
widgetAreas:
  - id: "sidebar"
    name: "侧边栏"
    description: "侧边栏小工具区域"
    maxWidgets: 6
  - id: "footer"
    name: "底部"
    description: "底部小工具区域"
    maxWidgets: 4
    columns: 4

# 主题特定设置
settings:
  colorSchemes:
    - name: "default"
      label: "默认"
      colors:
        primary: "#2d3436"
        secondary: "#636e72"
        accent: "#e17055"
    - name: "warm"
      label: "暖色"
      colors:
        primary: "#d63031"
        secondary: "#e17055"
        accent: "#fdcb6e"
    - name: "green"
      label: "自然绿"
      colors:
        primary: "#00b894"
        secondary: "#55a3a4"
        accent: "#81ecec"
  readingTimeWordsPerMinute: 200
