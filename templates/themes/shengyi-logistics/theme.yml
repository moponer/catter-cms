name: "胜翼危化品物流"
slug: "shengyi-logistics"
version: "1.0.0"
description: "专业危化品道路运输企业官网主题，适用于物流、运输类企业网站"
author: "Catter CMS"
screenshot: ""

# 页面模板定义
pageTemplates:
  - name: "图文页面"
    type: "page"
    icon: "document"
    description: "适用于公司介绍、服务说明等富文本内容"
    fields: []

  - name: "相册卡片"
    type: "gallery"
    icon: "images"
    description: "展示产品图片、车辆设备、荣誉资质等"
    fields:
      - name: "images"
        label: "图片列表"
        type: "image-list"
        required: true
      - name: "columns"
        label: "每行显示数量"
        type: "select"
        options:
          - value: "2"
            label: "2列"
          - value: "3"
            label: "3列"
          - value: "4"
            label: "4列"
        default: "3"

  - name: "联系表单"
    type: "contact"
    icon: "mail"
    description: "展示联系方式和地图"
    fields:
      - name: "showMap"
        label: "显示地图"
        type: "switch"
        default: true
      - name: "mapEmbedCode"
        label: "地图嵌入代码"
        type: "textarea"
        placeholder: "粘贴百度地图分享的嵌入代码"

configDefinition:
  - name: "基础信息"
    key: "basic"
    fields:
      - name: "phone"
        label: "联系电话"
        type: "text"
        default: "400-XXX-XXXX"
        placeholder: "请输入公司电话"
      - name: "address"
        label: "公司地址"
        type: "text"
        default: "上海市XXX区XXX路XXX号"
        placeholder: "请输入公司地址"
      - name: "email"
        label: "联系邮箱"
        type: "text"
        default: "info@example.com"
        placeholder: "请输入联系邮箱"
      - name: "qq"
        label: "QQ号码"
        type: "text"
        default: ""
        placeholder: "请输入QQ号"
      - name: "icp"
        label: "ICP备案号"
        type: "text"
        default: "沪ICP备XXXXXXXX号"
        placeholder: "请输入ICP备案号"
      - name: "footerDesc"
        label: "页脚公司简介"
        type: "textarea"
        default: "专注危险化学品道路运输，提供安全、高效、专业的物流解决方案。"

  - name: "颜色风格"
    key: "colors"
    fields:
      - name: "primaryColor"
        label: "主色调（深蓝）"
        type: "color"
        default: "#1B3A6B"
      - name: "primaryDark"
        label: "深主色（Header/Footer）"
        type: "color"
        default: "#0F2347"
      - name: "accentColor"
        label: "强调色（橙黄）"
        type: "color"
        default: "#E8880A"

  - name: "Hero 模块"
    key: "hero"
    fields:
      - name: "heroEnabled"
        label: "显示首页 Hero"
        type: "switch"
        default: true
      - name: "heroTitle"
        label: "Hero 主标题"
        type: "text"
        default: "专业危化品道路运输服务"
        placeholder: "Hero 大标题"
      - name: "heroSubtitle"
        label: "Hero 副标题"
        type: "text"
        default: "安全·高效·专业 | 全国道路危险货物运输资质认证"
        placeholder: "Hero 副标题/Slogan"
      - name: "heroBgImage"
        label: "Hero 背景图"
        type: "image"
        default: ""
      - name: "heroBgOpacity"
        label: "背景图透明度"
        type: "slider"
        min: 0
        max: 100
        step: 5
        default: 25
        description: "0=全透明，100=不透明"
      - name: "heroCta1"
        label: "CTA 按钮1文字"
        type: "text"
        default: "了解服务"
      - name: "heroCta1Link"
        label: "CTA 按钮1链接"
        type: "text"
        default: "/article-list"
      - name: "heroCta2"
        label: "CTA 按钮2文字"
        type: "text"
        default: "联系我们"
      - name: "heroCta2Link"
        label: "CTA 按钮2链接"
        type: "text"
        default: "/page/contact"

  - name: "数据统计"
    key: "stats"
    fields:
      - name: "statsYears"
        label: "服务年限"
        type: "number"
        default: 20
      - name: "statsCars"
        label: "车辆数量"
        type: "number"
        default: 100
      - name: "statsCities"
        label: "覆盖城市"
        type: "number"
        default: 50
      - name: "statsCategories"
        label: "危化品类别数"
        type: "number"
        default: 9

  - name: "地图与联系"
    key: "contact"
    fields:
      - name: "mapUrl"
        label: "百度地图嵌入 URL"
        type: "textarea"
        default: ""
        placeholder: "粘贴百度地图嵌入代码的 src URL"

  - name: "SEO"
    key: "seo"
    fields:
      - name: "metaKeywords"
        label: "关键词"
        type: "text"
        default: "危化品运输,危险品物流,道路运输,物流公司"
      - name: "metaDescription"
        label: "网站描述"
        type: "textarea"
        default: "专业危险化学品道路运输企业，提供安全高效的危化品物流解决方案"

  - name: "自定义代码"
    key: "custom"
    fields:
      - name: "customCSS"
        label: "自定义 CSS"
        type: "code"
        default: ""
      - name: "customJS"
        label: "自定义 JS"
        type: "code"
        default: ""

  - name: "相册设置"
    key: "gallery"
    fields:
      - name: "galleryImages"
        label: "相册图片 (JSON)"
        type: "textarea"
        default: "[]"
        placeholder: '例如: [{"url":"/uploads/img1.jpg","title":"车辆展示","category":"fleet"},{"url":"/uploads/img2.jpg","title":"荣誉资质","category":"honor"}]'
