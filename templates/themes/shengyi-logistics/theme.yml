# shengyi-logistics 主题配置定义
# 模块化首页设计标准

name: shengyi-logistics
version: 2.0.0
description: 盛意物流 - 危化品运输企业主题，支持首页模块化配置
author: Catter CMS Team

configDefinition:
  # ========== 全局设置 ==========
  - section: "global"
    label: "全局设置"
    icon: "cog"
    fields:
      - name: "phone"
        label: "联系电话"
        type: "text"
        default: "400-123-4567"
      - name: "address"
        label: "公司地址"
        type: "text"
        default: "上海市浦东新区物流园区A栋"
      - name: "email"
        label: "联系邮箱"
        type: "text"
        default: "contact@shengyi-logistics.com"
      - name: "icp"
        label: "ICP备案号"
        type: "text"
        default: "沪ICP备2024000001号"
      - name: "footerDesc"
        label: "页脚简介"
        type: "textarea"
        default: "专注危险化学品道路运输20年，提供安全、高效、合规的物流解决方案。"
      - name: "primaryColor"
        label: "主色调"
        type: "color"
        default: "#1B3A6B"
      - name: "primaryDark"
        label: "深主色"
        type: "color"
        default: "#0F2347"
      - name: "accentColor"
        label: "强调色"
        type: "color"
        default: "#E8880A"

  # ========== Hero 模块 ==========
  - section: "hero"
    label: "Hero 横幅模块"
    icon: "image"
    fields:
      - name: "heroEnabled"
        label: "启用模块"
        type: "switch"
        default: true
      - name: "heroTitle"
        label: "主标题"
        type: "text"
        default: "专业危化品道路运输服务"
      - name: "heroSubtitle"
        label: "副标题"
        type: "text"
        default: "安全·高效·专业 | 全国道路危险货物运输资质认证"
      - name: "heroBgImage"
        label: "背景图"
        type: "image"
        default: ""
      - name: "heroBgOpacity"
        label: "背景透明度"
        type: "slider"
        min: 0
        max: 100
        step: 5
        default: 25
      - name: "heroCta1Text"
        label: "按钮1文字"
        type: "text"
        default: "了解服务"
      - name: "heroCta1Link"
        label: "按钮1链接"
        type: "text"
        default: "#services"
      - name: "heroCta2Text"
        label: "按钮2文字"
        type: "text"
        default: "联系我们"
      - name: "heroCta2Link"
        label: "按钮2链接"
        type: "text"
        default: "#contact"

  # ========== 首页内容模块 ==========
  - section: "moduleOrder"
    label: "首页内容模块"
    icon: "th-large"
    description: "调整首页模块的显示顺序，点击模块编辑内容"
    fields:
      # 模块排序入口（用于拖拽排序）
      - name: "homeModuleOrder"
        label: "模块列表"
        type: "repeater"
        itemTitle: "name"
        default:
          - id: "advantages"
            name: "核心优势"
            dataKey: "advantagesItems"
          - id: "services"
            name: "服务项目"
            dataKey: "servicesItems"
          - id: "stats"
            name: "数据统计"
            dataKey: "statsItems"
        fields:
          - name: "id"
            label: "模块ID"
            type: "text"
          - name: "name"
            label: "模块名称"
            type: "text"
          - name: "dataKey"
            label: "数据字段"
            type: "text"

      # 核心优势数据
      - name: "advantagesEnabled"
        label: "启用核心优势模块"
        type: "switch"
        default: true
      - name: "advantagesItems"
        label: "核心优势 - 优势项目"
        type: "repeater"
        itemTitle: "title"
        default:
          - icon: "fa-satellite-dish"
            title: "GPS实时定位"
            description: "全程GPS追踪，实时掌握货物位置与状态"
          - icon: "fa-shield-halved"
            title: "资质认证"
            description: "持有全国道路危险货物运输资质证书"
          - icon: "fa-truck-fast"
            title: "安全运输"
            description: "20年零重大事故，安全运输体系完善"
          - icon: "fa-users"
            title: "专业团队"
            description: "持证上岗驾驶员与专业危化品操作人员"
        fields:
          - name: "icon"
            label: "图标"
            type: "icon"
          - name: "title"
            label: "标题"
            type: "text"
          - name: "description"
            label: "描述"
            type: "textarea"

      # 服务项目数据
      - name: "servicesEnabled"
        label: "启用服务项目模块"
        type: "switch"
        default: true
      - name: "servicesItems"
        label: "服务项目 - 服务列表"
        type: "repeater"
        itemTitle: "title"
        default:
          - icon: "fa-truck"
            title: "危化品运输"
            description: "易燃、易爆、腐蚀品等危险化学品道路运输"
          - icon: "fa-warehouse"
            title: "仓储服务"
            description: "符合安全标准的危化品仓储设施"
          - icon: "fa-dolly"
            title: "配送服务"
            description: "门到门配送，覆盖华东地区"
          - icon: "fa-phone-volume"
            title: "应急响应"
            description: "24小时应急热线，快速响应突发状况"
        fields:
          - name: "icon"
            label: "图标"
            type: "icon"
          - name: "title"
            label: "标题"
            type: "text"
          - name: "description"
            label: "描述"
            type: "textarea"

      # 数据统计数据
      - name: "statsEnabled"
        label: "启用数据统计模块"
        type: "switch"
        default: true
      - name: "statsItems"
        label: "数据统计 - 统计项"
        type: "repeater"
        itemTitle: "label"
        default:
          - value: "20"
            label: "年运营经验"
            suffix: "年"
          - value: "500+"
            label: "服务客户"
            suffix: ""
          - value: "100+"
            label: "运输线路"
            suffix: ""
          - value: "500万"
            label: "安全里程"
            suffix: "公里"
        fields:
          - name: "value"
            label: "数值"
            type: "text"
          - name: "label"
            label: "标签"
            type: "text"
          - name: "suffix"
            label: "单位后缀"
            type: "text"

  # ========== SEO 设置 ==========
  - section: "seo"
    label: "SEO 设置"
    icon: "search"
    fields:
      - name: "seoKeywords"
        label: "关键词"
        type: "text"
        default: "危化品运输,危险化学品物流,道路危险货物运输,上海物流公司"
      - name: "seoDescription"
        label: "网站描述"
        type: "textarea"
        default: "盛意物流专注危险化学品道路运输20年，持有全国道路危险货物运输资质，提供安全、高效、合规的危化品物流解决方案。"
      - name: "googleVerification"
        label: "Google 站长验证码"
        type: "text"
        default: ""
      - name: "baiduVerification"
        label: "百度站长验证码"
        type: "text"
        default: ""

  # ========== 自定义代码 ==========
  - section: "custom"
    label: "自定义代码"
    icon: "code"
    fields:
      - name: "customHead"
        label: "头部代码（<head> 内）"
        type: "code"
        language: "html"
        default: ""
      - name: "customFooter"
        label: "底部代码（</body> 前）"
        type: "code"
        language: "html"
        default: ""
