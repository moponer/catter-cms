{{ define "header" }}
<!-- ====== 导航栏 ====== -->
<nav class="site-nav">
    <div class="container">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                {{ if .site.logo }}
                <img src="{{ .site.logo }}" alt="{{ .site.title }}" class="nav-logo-img">
                {{ else }}
                <div class="nav-logo-icon"><i class="fa-solid fa-truck"></i></div>
                {{ end }}
                <div class="nav-logo-text">
                    <span class="nav-logo-main">{{ .site.title }}</span>
                    <span class="nav-logo-sub">{{ .site.description }}</span>
                </div>
            </a>
            <ul class="nav-menu" id="navMenu">
                {{ with .headerMenu }}{{ range .Items }}
                <li><a href="{{ .URL }}">{{ .Label }}</a></li>
                {{ end }}{{ else }}
                <li><a href="/">首页</a></li>
                <li><a href="/article">新闻动态</a></li>
                <li><a href="/page/about">关于我们</a></li>
                <li><a href="/page/fleet">运力展示</a></li>
                <li><a href="/page/contact">联系我们</a></li>
                {{ end }}
            </ul>
            <a href="tel:{{ getConfig "phone" "" }}" class="nav-phone">
                <span class="nav-phone-icon"><i class="fa-solid fa-phone"></i></span>
                {{ getConfig "phone" "" }}
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</nav>
{{ end }}
