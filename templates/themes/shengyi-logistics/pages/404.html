<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <title>页面未找到 - {{ .site.title }}</title>
    <link rel="stylesheet" href="{{ asset_path "assets/css/base.css" }}">
    <link rel="stylesheet" href="{{ asset_path "assets/css/article.css" }}">
    {{ if getConfig "customCSS" "" }}<style>{{ getConfig "customCSS" "" | safe }}</style>{{ end }}
</head>
<body>

{{ template "header" . }}

<div class="page-banner">
    <h1 class="page-banner-title">页面不存在</h1>
    <div class="page-banner-breadcrumb"><a href="/">首页</a><span>›</span>404</div>
</div>

<div class="error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">页面不存在</h1>
        <p class="error-desc">您访问的页面可能已删除、地址变更或暂时不可用，请返回首页或联系我们的客服。</p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">返回首页</a>
            <a href="/page/contact" class="btn btn-primary-filled">联系我们</a>
        </div>
    </div>
</div>

{{ template "footer" . }}
</body>
</html>
