name: "示例主题"
version: "1.0.0"
description: "类似Halo Earth主题的示例配置"
author: "WorkBuddy"
thumbnail: "screenshot.png"

# ============================================
# 主题配置定义（在管理后台显示的配置项）
# ============================================
configDefinition:
  # 第一组：布局设置
  - section: "布局设置"
    icon: "grid"
    description: "配置网站的布局方式"
    fields:
      - name: "layout_style"
        type: "select"
        label: "布局样式"
        description: "选择网站的布局方式"
        options:
          - label: "两栏布局（侧边栏在右侧）"
            value: "two-columns-right"
          - label: "两栏布局（侧边栏在左侧）"
            value: "two-columns-left"
          - label: "单栏布局（无侧边栏）"
            value: "single-column"
        default: "two-columns-right"

      - name: "content_width"
        type: "number"
        label: "内容宽度"
        description: "文章内容区域的最大宽度（像素）"
        min: 600
        max: 1200
        step: 50
        default: 800

      - name: "enable_breadcrumb"
        type: "switch"
        label: "显示面包屑导航"
        description: "在文章页面顶部显示面包屑导航"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

  # 第二组：样式设置
  - section: "样式设置"
    icon: "brush"
    description: "自定义主题的外观样式"
    fields:
      - name: "color_scheme"
        type: "select"
        label: "配色方案"
        description: "选择主题的配色方案"
        options:
          - label: "默认蓝"
            value: "default-blue"
          - label: "清新绿"
            value: "fresh-green"
          - label: "温暖橙"
            value: "warm-orange"
          - label: "优雅紫"
            value: "elegant-purple"
        default: "default-blue"

      - name: "border_radius"
        type: "slider"
        label: "圆角大小"
        description: "调整卡片和按钮的圆角大小"
        min: 0
        max: 20
        step: 1
        default: 8

      - name: "font_size_base"
        type: "select"
        label: "基础字号"
        description: "选择全局基础字体大小"
        options:
          - label: "14px（小）"
            value: "14"
          - label: "16px（标准）"
            value: "16"
          - label: "18px（大）"
            value: "18"
        default: "16"

      - name: "article_image_style"
        type: "radio"
        label: "文章封面图样式"
        description: "选择文章封面的显示样式"
        options:
          - label: "圆角"
            value: "rounded"
          - label: "方角"
            value: "square"
        default: "rounded"

      - name: "enable_card_shadow"
        type: "switch"
        label: "卡片阴影"
        description: "为文章卡片添加阴影效果"
        activeText: "启用"
        inactiveText: "禁用"
        default: true

  # 第三组：侧边栏设置
  - section: "侧边栏设置"
    icon: "menu"
    description: "配置侧边栏的内容和样式"
    fields:
      - name: "sidebar_position"
        type: "radio"
        label: "侧边栏位置"
        description: "设置侧边栏在页面中的位置"
        options:
          - label: "右侧"
            value: "right"
          - label: "左侧"
            value: "left"
        default: "right"

      - name: "enable_recent_posts"
        type: "switch"
        label: "显示最新文章"
        description: "在侧边栏显示最新的文章列表"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

      - name: "recent_posts_count"
        type: "number"
        label: "最新文章数量"
        description: "显示的最新文章数量"
        min: 3
        max: 20
        step: 1
        default: 5

      - name: "enable_categories"
        type: "switch"
        label: "显示分类列表"
        description: "在侧边栏显示文章分类"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

      - name: "enable_tags"
        type: "switch"
        label: "显示标签云"
        description: "在侧边栏显示文章标签"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

      - name: "enable_search_box"
        type: "switch"
        label: "显示搜索框"
        description: "在侧边栏显示搜索输入框"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

      - name: "search_placeholder"
        type: "text"
        label: "搜索框提示文字"
        placeholder: "请输入搜索关键词"
        default: "搜索文章..."

  # 第四组：页脚设置
  - section: "页脚设置"
    icon: "bottom"
    description: "自定义页脚信息"
    fields:
      - name: "footer_style"
        type: "select"
        label: "页脚样式"
        description: "选择页脚的显示方式"
        options:
          - label: "简洁型"
            value: "simple"
          - label: "完整型（包含所有链接）"
            value: "full"
          - label: "自定义HTML"
            value: "custom"
        default: "full"

      - name: "footer_text"
        type: "textarea"
        label: "页脚文字"
        description: "在页脚显示的自定义文字"
        rows: 3
        placeholder: "输入页脚文字，支持HTML"
        default: "&copy; 2024 我的博客. 保留所有权利."

      - name: "show_powered_by"
        type: "switch"
        label: "显示Powered By"
        description: "在页脚显示Powered by Catter CMS"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

      - name: "footer_columns"
        type: "number"
        label: "页脚列数"
        description: "页脚内容的列数（仅在完整型样式下有效）"
        min: 1
        max: 4
        step: 1
        default: 3

      - name: "show_social_links"
        type: "switch"
        label: "显示社交链接"
        description: "在页脚显示社交媒体链接"
        activeText: "显示"
        inactiveText: "隐藏"
        default: true

  # 第五组：备案设置
  - section: "备案设置"
    icon: "document"
    description: "配置网站备案信息"
    fields:
      - name: "show_icp"
        type: "switch"
        label: "显示ICP备案号"
        description: "在页脚显示ICP备案信息"
        activeText: "显示"
        inactiveText: "隐藏"
        default: false

      - name: "icp_number"
        type: "text"
        label: "ICP备案号"
        placeholder: "请输入ICP备案号，例如：京ICP备12345678号"
        description: "您的网站ICP备案编号"

      - name: "icp_link"
        type: "text"
        label: "ICP链接"
        placeholder: "工信部备案系统链接"
        default: "https://beian.miit.gov.cn/"

      - name: "show_police_icp"
        type: "switch"
        label: "显示公安备案号"
        description: "在页脚显示公安备案信息"
        activeText: "显示"
        inactiveText: "隐藏"
        default: false

      - name: "police_icp_number"
        type: "text"
        label: "公安备案号"
        placeholder: "请输入公安备案号，例如：京公网安备11010502012345号"

      - name: "police_icp_icon"
        type: "image"
        label: "公安备案图标"
        description: "上传公安备案的图标文件"

# ============================================
# 主题默认配置值
# ============================================
settings:
  layout_style: "two-columns-right"
  content_width: 800
  enable_breadcrumb: true
  color_scheme: "default-blue"
  border_radius: 8
  font_size_base: "16"
  article_image_style: "rounded"
  enable_card_shadow: true
  sidebar_position: "right"
  enable_recent_posts: true
  recent_posts_count: 5
  enable_categories: true
  enable_tags: true
  enable_search_box: true
  search_placeholder: "搜索文章..."
  footer_style: "full"
  footer_text: "&copy; 2024 我的博客. 保留所有权利."
  show_powered_by: true
  footer_columns: 3
  show_social_links: true
  show_icp: false
  icp_number: ""
  icp_link: "https://beian.miit.gov.cn/"
  show_police_icp: false
  police_icp_number: ""
  police_icp_icon: ""
