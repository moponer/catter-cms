<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catter CMS</title>
    <meta name="description" content="基于Buffalo + Go的内容管理系统">
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 1px solid #ddd; padding-bottom: 20px; margin-bottom: 20px; }
        nav a { margin-right: 20px; text-decoration: none; color: #333; }
        .post-list { display: grid; gap: 20px; }
        .post-card { border: 1px solid #eee; padding: 20px; border-radius: 8px; }
        .post-card h3 { margin-top: 0; }
        .post-meta { color: #666; font-size: 14px; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>Catter CMS</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/blog">博客</a>
            <a href="/about">关于</a>
        </nav>
    </header>
    <main>
        <h2>最新文章</h2>
        <div class="post-list">
            <%= for (post) in posts { %>
            <article class="post-card">
                <h3><a href="/blog/<%= post.Slug %>"><%= post.Title %></a></h3>
                <p><%= post.Excerpt %></p>
                <div class="post-meta">
                    <span>状态: <%= post.Status %></span>
                    <span>发布时间: <%= post.PublishedAt %></span>
                </div>
            </article>
            <% } %>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Catter CMS</p>
    </footer>
</body>
</html>
