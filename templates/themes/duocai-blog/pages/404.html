<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - {{ .site.title }}</title>
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="{{ asset_path "assets/css/base.css" }}">
    <link rel="stylesheet" href="{{ asset_path "assets/css/list.css" }}">
    <style>
        :root {
            --primary: {{ getConfig "primaryColor" "#FF6B6B" }};
            --primary-hover: {{ getConfig "primaryDark" "#EE5A5A" }};
            --accent: {{ getConfig "accentColor" "#4ECDC4" }};
            --secondary: {{ getConfig "secondaryColor" "#FFE66D" }};
            --purple: {{ getConfig "purpleAccent" "#A78BFA" }};
            --bg-primary: {{ getConfig "bgPrimary" "#FAFAFA" }};
            --bg-secondary: {{ getConfig "bgSecondary" "#FFFFFF" }};
            --bg-dark: {{ getConfig "bgDarkSection" "#2D2A4A" }};
            --text-primary: {{ getConfig "textPrimary" "#2D3748" }};
            --text-secondary: {{ getConfig "textSecondary" "#718096" }};
            --text-muted: {{ getConfig "textMuted" "#A0AEC0" }};
            --banner-bg: {{ getConfig "bannerBg" "var(--primary)" }};
        }
        .error-page {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3xl) var(--space-lg);
        }
        .error-content {
            text-align: center;
            max-width: 500px;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: var(--space-lg);
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-md);
        }
        .error-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
        }
        .error-text {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-2xl);
        }
        .error-actions {
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            background: var(--primary);
            color: white;
            border-radius: var(--radius-full);
            font-weight: 600;
            transition: all var(--transition-fast);
            text-decoration: none;
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            color: white;
        }
        .error-btn-secondary {
            background: var(--bg-dark);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo">
                <span class="logo-icon"><i class="fa-solid fa-feather-pointed"></i></span>
                {{ .site.title }}
            </a>
            <nav class="nav-menu">
                {{ range .headerMenu.Items }}
                <a href="{{ .URL }}" class="nav-link" {{ if eq .Target "_blank" }}target="_blank" rel="noopener"{{ end }}>{{ .Label }}</a>
                {{ end }}
            </nav>
            <div class="header-actions">
                <a href="/search" class="search-btn" aria-label="搜索">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- 404 Content -->
    <div class="error-page">
        <div class="error-content">
            <div class="error-icon">
                <i class="fa-solid fa-face-frown-open"></i>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">页面未找到</h1>
            <p class="error-text">
                抱歉，您访问的页面不存在或已被删除。<br>
                可能是 URL 输入错误，或者页面已经迁移。
            </p>
            <div class="error-actions">
                <a href="/" class="error-btn">
                    <i class="fa-solid fa-house"></i> 返回首页
                </a>
                <a href="/article" class="error-btn error-btn-secondary">
                    <i class="fa-solid fa-newspaper"></i> 浏览文章
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-simple">
                <div class="footer-nav">
                    {{ range .footerMenu.Items }}
                    <a href="{{ .URL }}" {{ if eq .Target "_blank" }}target="_blank" rel="noopener"{{ end }}>{{ .Label }}</a>
                    {{ end }}
                </div>
                <p class="footer-copyright">&copy; {{ .site.year }} {{ .site.title }} &middot; 用心记录每一天</p>
            </div>
        </div>
    </footer>
</body>
</html>
