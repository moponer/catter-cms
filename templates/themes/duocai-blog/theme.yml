# ============================================
# 多彩Blog主题配置文件
# 主题名称：多彩blog
# 版本：1.0.0
# 作者：Catter CMS
# 描述：活泼多彩的博客主题，采用现代年轻化设计风格
# ============================================

name: 多彩blog
slug: duocai-blog
version: 1.0.0
author: Catter CMS
description: 活泼多彩的博客主题，现代年轻化设计风格，丰富的侧边栏模块和交互效果

# 默认配置值（可被用户在后台修改）
config:
  # 主题色彩配置
  primaryColor: "#FF6B6B"
  primaryLight: "#FF8E8E"
  primaryDark: "#EE5A5A"
  accentColor: "#4ECDC4"
  accentLight: "#7EDDD6"
  secondaryColor: "#FFE66D"
  purpleAccent: "#A78BFA"
  
  # 背景色
  bgPrimary: "#FAFAFA"
  bgSecondary: "#FFFFFF"
  bgDarkSection: "#2D2A4A"
  bgGradient: "linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%)"
  bannerBg: ""
  
  # 文字色
  textPrimary: "#2D3748"
  textSecondary: "#718096"
  textMuted: "#A0AEC0"
  textLight: "#FFFFFF"
  
  # 边框色
  borderColor: "#E2E8F0"
  
  # 布局配置
  sidebarEnabled: true
  sidebarPosition: "right"
  articlesPerPage: 10
  showViews: true
  showComments: true
  showLikes: true
  
  # Hero区域
  heroEnabled: true
  innerHeroEnabled: true
  heroTitle: "欢迎来到多彩blog"
  heroSubtitle: "分享技术与生活，记录成长点滴"
  heroShowAvatar: true
  
  # 侧边栏模块
  sidebarProfile: true
  sidebarCategories: true
  sidebarTags: true
  sidebarPopular: true
  sidebarSocial: true
  sidebarAds: false
  
  # 文章列表样式
  postListStyle: "card"
  showExcerpt: true
  showThumbnail: true
  showCategory: true
  showTags: true
  
  # 标签云样式
  tagCloudStyle: "flat"
  
  # 社交媒体链接
  socialWeibo: ""
  socialZhihu: ""
  socialGithub: ""
  socialTwitter: ""

  # 博主信息
  authorName: ""
  authorBio: "热爱技术，分享生活"
  authorAvatar: ""
  authorShowStats: true
  
  # 页脚配置
  footerAbout: "这是一个充满活力和创意的博客主题"
  footerLinks: '[{"name":"关于我们","url":"/page/about"},{"name":"联系我们","url":"/page/contact"},{"name":"隐私政策","url":"/page/privacy"}]'

# 配置表单定义（后台配置界面）
configDefinition:
  # 分组1：基础设置
  - section: basic
    label: 基础设置
    icon: fa-solid fa-gear
    fields:
      - name: sidebarEnabled
        type: switch
        label: 显示侧边栏
        default: true
      - name: sidebarPosition
        type: radio
        label: 侧边栏位置
        options:
          - value: right
            label: 右侧
          - value: left
            label: 左侧
        default: right
        show_if: "sidebarEnabled == true"
      - name: articlesPerPage
        type: number
        label: 每页文章数
        default: 10
      - name: postListStyle
        type: select
        label: 文章列表样式
        options:
          - value: card
            label: 卡片式
          - value: list
            label: 列表式
          - value: magazine
            label: 杂志式
        default: card

  # 分组2：主题色彩
  - section: colors
    label: 主题色彩
    icon: fa-solid fa-palette
    fields:
      - name: primaryColor
        type: color
        label: 主色调
        default: "#FF6B6B"
      - name: primaryLight
        type: color
        label: 浅主色
        default: "#FF8E8E"
      - name: primaryDark
        type: color
        label: 深主色
        default: "#EE5A5A"
      - name: accentColor
        type: color
        label: 强调色
        default: "#4ECDC4"
      - name: secondaryColor
        type: color
        label: 辅助色
        default: "#FFE66D"
      - name: purpleAccent
        type: color
        label: 紫色点缀
        default: "#A78BFA"
      - name: bannerBg
        type: text
        label: 页面横幅背景
        description: "所有内页顶部横幅的背景，支持颜色值或渐变，如 #FF6B6B 或 linear-gradient(135deg, #FF6B6B, #4ECDC4)，默认跟随主色调"
        default: ""

  # 分组3：Hero区域
  - section: hero
    label: Hero区域
    icon: fa-solid fa-image
    fields:
      - name: heroEnabled
        type: switch
        label: 首页显示Hero区域
        default: true
      - name: innerHeroEnabled
        type: switch
        label: 内页显示Hero区域
        description: "开启后，文章、分类、标签等所有内页顶部也会显示与首页相同的Hero轮播横幅"
        default: true
      - name: heroTitle
        type: text
        label: 主标题
        default: "欢迎来到多彩blog"
        show_if: "heroEnabled == true"
      - name: heroSubtitle
        type: textarea
        label: 副标题
        default: "分享技术与生活，记录成长点滴"
        show_if: "heroEnabled == true"
      - name: heroShowAvatar
        type: switch
        label: 显示头像
        default: true
        show_if: "heroEnabled == true"
      - name: heroSlides
        type: image-list
        label: 轮播图片
        description: 上传图片作为Hero区域轮播图，支持多张图片自动切换
        show_if: "heroEnabled == true"

  # 分组4：侧边栏模块
  - section: sidebar
    label: 侧边栏模块
    icon: fa-solid fa-columns
    fields:
      - name: sidebarProfile
        type: switch
        label: 显示作者资料
        default: true
        show_if: "sidebarEnabled == true"
      - name: authorName
        type: text
        label: 作者昵称
        default: ""
        show_if: "sidebarEnabled == true && sidebarProfile == true"
      - name: authorBio
        type: textarea
        label: 作者简介
        default: "热爱技术，分享生活"
        show_if: "sidebarEnabled == true && sidebarProfile == true"
      - name: authorAvatar
        type: image
        label: 作者头像
        default: ""
        show_if: "sidebarEnabled == true && sidebarProfile == true"
      - name: authorShowStats
        type: switch
        label: 显示文章统计
        default: true
        show_if: "sidebarEnabled == true && sidebarProfile == true"
      - name: sidebarCategories
        type: switch
        label: 显示分类列表
        default: true
        show_if: "sidebarEnabled == true"
      - name: sidebarTags
        type: switch
        label: 显示标签云
        default: true
        show_if: "sidebarEnabled == true"
      - name: sidebarPopular
        type: switch
        label: 显示热门文章
        default: true
        show_if: "sidebarEnabled == true"
      - name: sidebarSocial
        type: switch
        label: 显示社交媒体
        default: true
        show_if: "sidebarEnabled == true"
      - name: sidebarAds
        type: switch
        label: 显示广告位
        default: false
        show_if: "sidebarEnabled == true"

  # 分组5：文章显示
  - section: article
    label: 文章显示
    icon: fa-solid fa-newspaper
    fields:
      - name: showViews
        type: switch
        label: 显示阅读量
        default: true
      - name: showComments
        type: switch
        label: 显示评论数
        default: true
      - name: showLikes
        type: switch
        label: 显示点赞数
        default: true
      - name: showExcerpt
        type: switch
        label: 显示文章摘要
        default: true
      - name: showThumbnail
        type: switch
        label: 显示缩略图占位
        default: true
      - name: showCategory
        type: switch
        label: 显示所属分类
        default: true
      - name: showTags
        type: switch
        label: 显示标签
        default: true

  # 分组6：标签云
  - section: tagcloud
    label: 标签云设置
    icon: fa-solid fa-tags
    fields:
      - name: tagCloudStyle
        type: select
        label: 标签云样式
        options:
          - value: flat
            label: 扁平标签
          - value: colorful
            label: 彩色标签
          - value: heat
            label: 热度标签
        default: flat

  # 分组7：社交媒体
  - section: social
    label: 社交媒体
    icon: fa-solid fa-share-alt
    fields:
      - name: socialWeibo
        type: text
        label: 微博链接
        placeholder: https://weibo.com/xxx
      - name: socialZhihu
        type: text
        label: 知乎链接
        placeholder: https://zhihu.com/xxx
      - name: socialGithub
        type: text
        label: GitHub链接
        placeholder: https://github.com/xxx
      - name: socialTwitter
        type: text
        label: Twitter链接
        placeholder: https://twitter.com/xxx

  # 分组8：页脚设置
  - section: footer
    label: 页脚设置
    icon: fa-solid fa-shoe-prints
    fields:
      - name: footerAbout
        type: textarea
        label: 关于描述
        default: "这是一个充满活力和创意的博客主题"
