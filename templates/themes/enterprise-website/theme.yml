# ========================================
# Enterprise Website 企业官网主题配置
# 版本: 2.1.0 (精简版)
# ========================================

# 主题基本信息
name: "Enterprise Website"
version: "2.1.0"
apiVersion: "2.0"
description: "通用企业官网主题，适合各类企业展示使用"
author: "Catter Team"
authorEmail: "support@cattercms.com"
authorUrl: "https://cattercms.com"
license: "MIT"
tags: ["enterprise", "business", "corporate", "responsive"]
thumbnail: "assets/images/thumbnail.svg"

# 依赖要求
requires:
  buffalo: ">=0.18.0"
  catterCms: ">=2.0.0"

# 主题能力声明
capabilities:
  layouts: [default, home, about, services, contact]
  modules: [hero, about, services, team, testimonials, contact, footer]
  widgets: [search, categories, tags, recent-posts]
  postFormats: [standard]
  customFields: true
  customTemplates: true
  colorSchemes: true
  darkMode: false

# ========================================
# 默认配置
# ========================================
config:
  # 外观配置
  appearance:
    colors:
      primary: "#1a202c"
      secondary: "#2d3748"
      accent: "#4299e1"
    typography:
      baseFont: "'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif"
    layout:
      width: "1200px"

  # Hero模块
  modules:
    hero:
      enabled: true
      config:
        title: "专业企业解决方案"
        subtitle: "助力企业数字化转型"
        backgroundType: "color"
        backgroundColor: "#1a202c"
        ctaText: "了解更多"
        ctaUrl: "/about"
        showCta: true

  # 自定义代码
  custom:
    css: ""
    js: ""

# ========================================
# 配置定义(用于生成管理后台配置表单)
# ========================================
configDefinition:
  # 外观配置
  - section: "外观"
    icon: "palette"
    description: "配置主题颜色、字体等外观设置"
    fields:
      - name: "appearance.colors.primary"
        label: "主色调"
        type: "color"
        showAlpha: false
        default: "#1a202c"
        description: "网站的主色调"

      - name: "appearance.colors.secondary"
        label: "次要颜色"
        type: "color"
        showAlpha: false
        default: "#2d3748"
        description: "次要颜色"

      - name: "appearance.colors.accent"
        label: "强调色"
        type: "color"
        showAlpha: false
        default: "#4299e1"
        description: "用于按钮、链接等强调元素"

      - name: "appearance.layout.width"
        label: "内容宽度"
        type: "text"
        placeholder: "例如: 1200px"
        default: "1200px"

  # Hero模块
  - section: "Hero模块"
    icon: "view"
    description: "配置首页Hero区域"
    fields:
      - name: "modules.hero.enabled"
        label: "启用Hero模块"
        type: "switch"
        default: true

      - name: "modules.hero.config.title"
        label: "主标题"
        type: "text"
        default: "专业企业解决方案"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.subtitle"
        label: "副标题"
        type: "textarea"
        default: "助力企业数字化转型"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.showCta"
        label: "显示按钮"
        type: "switch"
        default: true
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.ctaText"
        label: "按钮文本"
        type: "text"
        default: "了解更多"
        show_if: "modules.hero.enabled && modules.hero.config.showCta"

      - name: "modules.hero.config.ctaUrl"
        label: "按钮链接"
        type: "text"
        default: "/page/about"
        placeholder: "例如: /page/about, /page/services"
        description: "点击按钮后跳转的目标地址"
        show_if: "modules.hero.enabled && modules.hero.config.showCta"

  # 自定义代码
  - section: "自定义代码"
    icon: "code"
    description: "添加自定义CSS和JavaScript代码"
    fields:
      - name: "custom.css"
        label: "自定义CSS"
        type: "code"
        language: "css"
        rows: 8

      - name: "custom.js"
        label: "自定义JavaScript"
        type: "code"
        language: "javascript"
        rows: 8

# 菜单位置定义
menuLocations:
  header:
    name: "顶部导航"
    description: "网站顶部主导航菜单"
    maxDepth: 3
  footer:
    name: "底部导航"
    description: "网站底部导航菜单"
    maxDepth: 2

# 小工具区域定义
widgetAreas:
  - id: "sidebar"
    name: "侧边栏"
    description: "侧边栏小工具区域"
    maxWidgets: 6

# 主题特定设置
settings:
  colorSchemes:
    - name: "default"
      label: "默认"
      colors:
        primary: "#1a202c"
        secondary: "#2d3748"
        accent: "#4299e1"
    - name: "corporate"
      label: "商务蓝"
      colors:
        primary: "#1e3a5f"
        secondary: "#2c5282"
        accent: "#3182ce"
