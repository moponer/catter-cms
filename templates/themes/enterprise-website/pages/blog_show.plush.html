<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= post.Title %> - <%= site["title"] %></title>
    <meta name="description" content="<%= post.Excerpt %>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Helvetica Neue', Arial, -apple-system, sans-serif;
            line-height: 1.7;
            color: #2d3748;
            background: #fff;
        }
        
        .navbar {
            background: #1a202c;
            padding: 0 60px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        
        .brand {
            color: white;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: 700;
        }
        
        .nav-links a {
            color: #a0aec0;
            text-decoration: none;
            margin-left: 50px;
            font-weight: 500;
        }
        
        .nav-links a:hover { color: white; }
        
        .article-container {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 30px;
        }
        
        .article {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .article-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .article-header h1 {
            font-size: 2.5em;
            line-height: 1.3;
            color: #1a202c;
            margin-bottom: 20px;
        }
        
        .article-meta {
            display: flex;
            gap: 20px;
            color: #718096;
        }
        
        .article-content {
            font-size: 1.1em;
            line-height: 1.9;
            color: #4a5568;
        }
        
        .article-content h2 {
            margin: 40px 0 20px;
            color: #1a202c;
            font-size: 1.8em;
        }
        
        .article-content p { margin-bottom: 20px; }
        
        .article-content pre {
            background: #1a202c;
            color: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }
        
        .article-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        footer {
            background: #1a202c;
            color: white;
            padding: 40px 60px;
            text-align: center;
        }
        
        footer p { color: #a0aec0; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="brand">Enterprise</a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/services">服务</a>
                <a href="/blog">新闻</a>
                <a href="/contact">联系我们</a>
            </div>
        </div>
    </nav>
    
    <main class="article-container">
        <article class="article">
            <header class="article-header">
                <h1><%= post.Title %></h1>
                <div class="article-meta">
                    <span>📅 <%= post.PublishedAt %></span>
                    <span>👁 <%= post.Views %> 阅读</span>
                </div>
            </header>
            
            <div class="article-content">
                <%= post.Content %>
            </div>
        </article>
    </main>
    
    <footer>
        <p>&copy; 2026 <%= site["title"] %>. All Rights Reserved.</p>
    </footer>
</body>
</html>
