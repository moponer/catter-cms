<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="/fontawesome/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/fontawesome/css/all.min.css"></noscript>
    {{ if .site.favicon }}
    <link rel="icon" href="{{ .site.favicon }}">
    {{ end }}
    <title>页面未找到 - {{ .site.title }}</title>
    <link rel="stylesheet" href="{{ asset_path "assets/css/base.css" }}">
</head>
<body data-color-scheme="{{ getConfig "colorScheme" "default" }}">

{{ template "header" . }}

<div class="error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">页面未找到</h1>
        <p class="error-desc">抱歉，您访问的页面不存在或已被移除。</p>
        <div class="error-actions">
            <a href="/" class="error-btn-home"><i class="fa-solid fa-house"></i> 返回首页</a>
        </div>
    </div>
</div>

{{ template "footer" . }}

<script src="{{ asset_path "assets/js/main.js" }}"></script>
</body>
</html>
