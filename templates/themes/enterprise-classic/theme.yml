name: 企业经典官网
version: 3.0.0
description: 传统企业官网主题，三层Header+居中Banner+蓝色简介区+图片服务卡+双栏新闻+蓝色四栏Footer。参考远笙物流布局风格。
author: Catter CMS Team

configDefinition:
  # ========== 全局设置 ==========
  - section: "global"
    label: "全局设置"
    icon: "cog"
    fields:
      - name: "logo"
        label: "Logo图片"
        type: "image"
        default: ""
      - name: "footerCopyright"
        label: "底部版权信息"
        type: "text"
        default: "Copyright \u00a9 2026 \u516c\u53f8\u540d\u79f0 \u7248\u6743\u6240\u6709"

      # Header 新增字段
      - name: "headerSlogan"
        label: "\u9876\u90e8\u680f\u53e3\u53f7"
        type: "text"
        default: "\u6b22\u8fce\u8bbf\u95ee\uff0c\u8bda\u4fe1\u670d\u52a1\u503c\u5f97\u4fe1\u8d56\uff01\uff01\uff01"
      - name: "headerTopLinks"
        label: "\u987d\u90e8\u94fe\u63a5"
        type: "repeater"
        itemTitle: "label"
        default:
          - label: "\u5173\u4e8e\u6211\u4eec"
            url: "/page/about"
          - label: "\u5408\u4f5c\u54a8\u8be2"
            url: "/page/contact"
        fields:
          - name: "label"
            label: "\u6587\u5b57"
            type: "text"
          - name: "url"
            label: "\u94fe\u63a5"
            type: "text"
          - name: "target"
            label: "\u65b0\u7a97\u6253\u5f00"
            type: "switch"
            default: false
      - name: "hotlineLabel"
        label: "\u70ed\u7ebf\u6807\u7b7e"
        type: "text"
        default: "\u5168\u56fd24\u5c0f\u65f6\u670d\u52a1\u70ed\u7ebf:"
      - name: "hotlineNumber"
        label: "\u70ed\u7ebf\u7535\u8bdd"
        type: "text"
        default: ""
      - name: "homeNavText"
        label: "\u9996\u9875\u5bfc\u822a\u6587\u5b57"
        type: "text"
        default: "\u9996\u9875\u63a8\u8350"

  # ========== Hero 横幅 ==========
  - section: "hero"
    label: "Hero \u6a2a\u5e45"
    icon: "image"
    fields:
      - name: "heroEnabled"
        label: "\u542f\u7528\u6a21\u5757"
        type: "switch"
        default: true
      - name: "heroTitle"
        label: "\u4e3b\u6807\u9898(\u5c45\u4e2d)"
        type: "text"
        default: "\u63d0\u4f9b\u4e13\u4e1a\u7684\u4e00\u7ad9\u5f0f\u7269\u6d41\u670d\u52a1"
      - name: "breadcrumbText"
        label: "\u9762\u5305\u788e\u6587\u5b57"
        type: "text"
        default: ""
      - name: "searchPlaceholder"
        label: "\u641c\u7d22\u6846\u5360\u4f4d\u7b26"
        type: "text"
        default: "\u8bf7\u8f93\u5165\u5173\u952e\u5b57\u641c\u7d22"
      - name: "heroBgImage"
        label: "\u80cc\u666f\u56fe\u7247(\u517c\u5bb9\u65e7\u6570\u636e)"
        type: "image"
        default: ""
      - name: "heroBgImages"
        label: "\u80cc\u666f\u8f6e\u64ad"
        type: "image-list"
        default: []
        description: "\u652f\u6301\u591a\u5f20\u56fe\u7247\u81ea\u52a8\u5207\u6362"

  # ========== \u5173\u4e8e\u6211\u4eec(\u84dd\u8272\u5168\u5bbd) ==========
  - section: "about"
    label: "\u516c\u53f8\u7b80\u4ecb"
    icon: "info-circle"
    fields:
      - name: "aboutEnabled"
        label: "\u542f\u7528\u6a21\u5757"
        type: "switch"
        default: true
      - name: "aboutTitle"
        label: "\u533a\u5757\u6807\u9898"
        type: "text"
        default: "\u516c\u53f8\u7b80\u4ecb"
      - name: "aboutSubtitleEn"
        label: "\u82f1\u6587\u526f\u6807\u9898"
        type: "text"
        default: "ABOUTUS"
      - name: "aboutLink"
        label: "\u8be6\u60c5\u94fe\u63a5"
        type: "text"
        default: "/page/about"
      - name: "aboutImage"
        label: "\u5c55\u793a\u56fe\u7247(\u5355\u5f20)"
        type: "image"
        default: ""
      - name: "aboutImages"
        label: "\u591a\u56fe\u8f6e\u64ad"
        type: "image-list"
        default: []
      - name: "aboutContent"
        label: "\u7b80\u4ecb\u5185\u5bb9"
        type: "textarea"
        default: "\u8fd9\u662f\u4e00\u6bb5\u516c\u53f8\u7b80\u4ecb\uff0c\u8bf7\u524d\u5f80\u540e\u53f0\u7f16\u8f91\u3002"

  # ========== \u670d\u52a1\u9879\u76ee(\u56fe\u7247\u5361\u7247) ==========
  - section: "services"
    label: "\u670d\u52a1\u9879\u76ee"
    icon: "briefcase"
    fields:
      - name: "servicesEnabled"
        label: "\u542f\u7528\u6a21\u5757"
        type: "switch"
        default: true
      - name: "servicesTitle"
        label: "\u533a\u5757\u6807\u9898"
        type: "text"
        default: "\u670d\u52a1\u9879\u76ee"
      - name: "servicesEnTitle"
        label: "\u82f1\u6587\u526f\u6807\u9898"
        type: "text"
        default: "ALBUM"
      - name: "servicesSubtitle"
        label: "\u533a\u5757\u526f\u6807\u9898"
        type: "text"
        default: ""
      - name: "servicesList"
        label: "\u670d\u52a1\u5217\u8868"
        type: "repeater"
        itemTitle: "title"
        default:
          - title: "\u96f6\u62c5\u914d\u9001"
            image: ""
            description: "\u8986\u76d6\u5168\u56fd\u4e3b\u8981\u57ce\u5e02\u7684\u96f6\u62c5\u914d\u9001\u7f51\u7edc"
          - title: "\u957f\u9014\u6574\u8f66"
            image: ""
            description: "\u63d0\u4f9b\u5168\u56fd\u8303\u56f4\u5185\u7684\u6574\u8f8d\u8fd0\u8f93\u670d\u52a1"
          - title: "\u516c\u8def\u8fd0\u8f93"
            image: ""
            description: "\u4e13\u4e1a\u5feb\u9012\u8fd0\u8f93\u670d\u52a1\uff0c\u53ca\u65f6\u5230\u8fbe"
          - title: "\u96c6\u88c5\u7bb1\u8fd0\u8f93"
            image: ""
            description: "\u6db5\u76d6\u6d77\u8fd0\u3001\u94c1\u8def\u96c6\u88c5\u7bb1\u8fd0\u8f93"
          - title: "\u5362\u8f66\u8fd0\u8f93"
            image: ""
            description: "\u5927\u578b\u8bbe\u5907\u3001\u673a\u68b0\u8bbe\u5907\u7279\u79cd\u8f66\u8f86\u8fd0\u8f93"
        fields:
          - name: "title"
            label: "\u6807\u9898"
            type: "text"
          - name: "image"
            label: "\u56fe\u7247"
            type: "image"
          - name: "icon"
            label: "\u56fe\u6807"
            type: "icon"
          - name: "description"
            label: "\u63cf\u8ff0"
            type: "textarea"

  # ========== \u65b0\u95fb\u8d44\u8baf(\u53cc\u680f) ==========
  - section: "news"
    label: "\u65b0\u95fb\u8d44\u8baf"
    icon: "newspaper-o"
    fields:
      - name: "newsEnabled"
        label: "\u542f\u7528\u6a21\u5757"
        type: "switch"
        default: true
      - name: "newsTitle"
        label: "\u533a\u5757\u6807\u9898"
        type: "text"
        default: "\u65b0\u95fb\u8d44\u8baf"
      - name: "newsCount"
        label: "\u663e\u793a\u6570\u91cf"
        type: "number"
        default: 5
        min: 3
        max: 20
      - name: "newsTab1Name"
        label: "Tab1 \u540d\u79f0"
        type: "text"
        default: "\u516c\u53f8\u52a8\u6001"
        description: "\u65b0\u95fb\u533a\u5757\u5de6\u4fa7\u7b2c\u4e00\u4e2aTab\u7684\u540d\u79f0"
      - name: "newsTab2Name"
        label: "Tab2 \u540d\u79f0"
        type: "text"
        default: "\u884c\u4e1a\u52a8\u6001"
        description: "\u65b0\u95fb\u533a\u5757\u5de6\u4fa7\u7b2c\u4e8c\u4e2aTab\u7684\u540d\u79f0"
      - name: "qaList"
        label: "\u5e38\u89c1\u95ee\u9898 Q&A"
        type: "repeater"
        itemTitle: "question"
        default: []
        description: "\u53f3\u4fa7Q&A\u5217\u8868\u7684\u95ee\u9898\uff0c\u4e0d\u586b\u5199\u65f6\u81ea\u52a8\u663e\u793a\u6700\u65b0\u6587\u7ae0"
        fields:
          - name: "question"
            label: "\u95ee\u9898(Q)"
            type: "text"
          - name: "answer"
            label: "\u7b54\u6848(A)"
            type: "textarea"

  # ========== Footer ==========
  - section: "footer"
    label: "\u9875\u811a\u8bbe\u7f6e"
    icon: "footer"
    fields:
      - name: "footerEnabled"
        label: "\u542f\u7528\u591a\u680fFooter"
        type: "switch"
        default: true
      - name: "footerCompany"
        label: "\u516c\u53f8\u540d\u79f0"
        type: "text"
        default: ""
      - name: "footerDesc"
        label: "\u516c\u53f8\u7b80\u4ecb"
        type: "textarea"
        default: ""
      - name: "footerContact"
        label: "\u8054\u7cfb\u65b9\u5f0f"
        type: "repeater"
        itemTitle: "label"
        default: []
        fields:
          - name: "icon"
            label: "\u56fe\u6807"
            type: "icon"
          - name: "label"
            label: "\u6807\u7b7e"
            type: "text"
          - name: "value"
            label: "\u5185\u5bb9"
            type: "text"
      - name: "footerContactTitle"
        label: "\u8054\u7cfb\u65b9\u5f0f\u680f\u6807\u9898"
        type: "text"
        default: "\u8054\u7cfb\u65b9\u5f0f"
        description: "\u7b2c\u4e09\u680f\u201c\u8054\u7cfb\u65b9\u5f0f\u201d\u6807\u9898"
      - name: "footerNavTitle2"
        label: "\u4e1a\u52a1\u8303\u56f4\u680f\u6807\u9898"
        type: "text"
        default: "\u4e1a\u52a1\u8303\u56f4"
        description: "\u65e0\u8054\u7cfb\u65b9\u5f0f\u6570\u636e\u65f6\u7b2c\u4e09\u680f\u7684\u6807\u9898"
      - name: "footerNavTitle3"
        label: "\u66f4\u591a\u4fe1\u606f\u680f\u6807\u9898"
        type: "text"
        default: "\u66f4\u591a\u4fe1\u606f"
        description: "\u7b2c\u56db\u680f\u201c\u66f4\u591a\u4fe1\u606f\u201d\u6807\u9898"
      - name: "friendLinks"
        label: "\u53cb\u60c5\u94fe\u63a5"
        type: "repeater"
        itemTitle: "label"
        default: []
        description: "Footer\u9876\u90e8\u7684\u53cb\u60c5\u94fe\u63a5\u884c"
        fields:
          - name: "label"
            label: "\u7ad9\u70b9\u540d\u79f0"
            type: "text"
          - name: "url"
            label: "\u94fe\u63a5\u5730\u5740"
            type: "text"
      - name: "icpNumber"
        label: "ICP\u5907\u6848\u53f7"
        type: "text"
        default: ""

  # ========== \u6587\u7ae0\u5217\u8868\u9875 ==========
  - section: "articleList"
    label: "\u6587\u7ae0\u5217\u8868\u9875"
    icon: "fa-solid fa-list"
    fields:
      - name: "articleListEnabled"
        label: "\u542f\u7528\u6587\u7ae0\u5217\u8868\u9875"
        type: "switch"
        default: true
      - name: "articleListTitle"
        label: "\u9875\u9762\u6807\u9898"
        type: "text"
        default: "\u65b0\u95fb\u8d44\u8baf"
      - name: "articleListSubtitle"
        label: "\u9875\u9762\u526f\u6807\u9898"
        type: "text"
        default: "\u4e86\u89e3\u884c\u4e1a\u52a8\u6001\uff0c\u83b7\u53d6\u6700\u65b0\u8d44\u8baf"
      - name: "articleListLayout"
        label: "\u5e03\u5c40\u6837\u5f0f"
        type: "select"
        default: "list"
        options:
          - value: "list"
            label: "\u5217\u8868\u5f0f"
          - value: "card"
            label: "\u5361\u7247\u5f0f"
          - value: "grid"
            label: "\u7f51\u683c\u5f0f"
      - name: "articleListBgImage"
        label: "\u6a2a\u5e45\u80cc\u666f\u56fe"
        type: "image"
        default: ""
        description: "\u6587\u7ae0\u5217\u8868\u9875\u6a2a\u5e45\u80cc\u666f\u56fe\uff0c\u4e0d\u586b\u5219\u4f7f\u7528\u9996\u9875Banner\u56fe"
      - name: "articleListColumns"
        label: "\u7f51\u683c\u5217\u6570"
        type: "select"
        default: "3"
        options:
          - value: "2"
            label: "2\u5217"
          - value: "3"
            label: "3\u5217"
          - value: "4"
            label: "4\u5217"
        description: "\u7f51\u683c\u5e03\u5c40\u65f6\u7684\u5217\u6570"
      - name: "articleListPageSize"
        label: "\u6bcf\u9875\u6570\u91cf"
        type: "number"
        default: 10
        min: 3
        max: 20
      - name: "articleListShowCategory"
        label: "\u663e\u793a\u5206\u7c7b\u7b5b\u9009"
        type: "switch"
        default: true
      - name: "articleListShowSidebar"
        label: "\u663e\u793a\u4fa7\u8fb9\u680f"
        type: "switch"
        default: false
      - name: "articleListSidebarPosition"
        label: "\u4fa7\u8fb9\u680f\u4f4d\u7f6e"
        type: "select"
        default: "right"
        options:
          - value: "left"
            label: "\u5de6\u4fa7"
          - value: "right"
            label: "\u53f3\u4fa7"

  # ========== \u81ea\u5b9a\u4e49\u4ee3\u7801 ==========
  - section: "custom"
    label: "\u81ea\u5b9a\u4e49\u4ee3\u7801"
    icon: "code"
    fields:
      - name: "customHead"
        label: "\u5934\u90e8\u4ee3\u7801(<head> \u5185)"
        type: "code"
        language: "html"
        default: ""
      - name: "customFooter"
        label: "\u5e95\u90e8\u4ee3\u7801(</body> \u524d)"
        type: "code"
        language: "html"
        default: ""

# =============================================
# \u4fa7\u8fb9\u680f\u6a21\u5757\u5b9a\u4e49
# =============================================
sidebarModules:
  - id: "recent_posts"
    name: "\u6700\u65b0\u6587\u7ae0"
    icon: "fa-solid fa-clock"
    limit: 5
  - id: "hot_posts"
    name: "\u70ed\u95e8\u6587\u7ae0"
    icon: "fa-solid fa-fire"
    limit: 5
  - id: "categories"
    name: "\u5206\u7c7b\u5217\u8868"
    icon: "fa-solid fa-folder"
    show_count: true
  - id: "tags"
    name: "\u6807\u7b7e\u4e91"
    icon: "fa-solid fa-tags"
    limit: 20
  - id: "site_info"
    name: "\u7ad9\u70b9\u4fe1\u606f"
    icon: "fa-solid fa-globe"
  - id: "search"
    name: "\u641c\u7d22\u6846"
    icon: "fa-solid fa-search"
  - id: "social_links"
    name: "\u793e\u4ea4\u94fe\u63a5"
    icon: "fa-solid fa-share-nodes"
  - id: "recent_comments"
    name: "\u6700\u65b0\u8bc4\u8bba"
    icon: "fa-solid fa-comments"
    limit: 5

templateSidebarDefaults:
  "article_show":
    enabled: true
    position: "right"
    modules:
      - id: "recent_posts"
        enabled: true
        sort: 1
      - id: "categories"
        enabled: true
        sort: 2
  "page":
    enabled: false
    position: "right"
    modules: []

pageTemplates:
  - type: "gallery"
    name: "\u56fe\u7247\u706f\u7bb1"
    icon: "fa-solid fa-images"
    description: "\u9002\u7528\u4e8e\u56fe\u7247\u5c55\u793a\u9875\u9762\uff0c\u652f\u6301\u706f\u7bb1\u6d4f\u89c8"
    hasSidebar: true
    fields:
      - name: "columns"
        label: "\u5217\u6570"
        type: "select"
        default: "3"
        options:
          - value: "2"
            label: "2\u5217"
          - value: "3"
            label: "3\u5217"
          - value: "4"
            label: "4\u5217"
      - name: "images"
        label: "\u56fe\u7247\u5217\u8868"
        type: "image-list"
  - type: "contact"
    name: "\u8054\u7cfb\u6211\u4eec"
    icon: "fa-solid fa-envelope"
    description: "\u8054\u7cfb\u4fe1\u606f\u5c55\u793a\u9875\u9762"
    hasSidebar: true
    fields:
      - name: "contactTitle"
        label: "\u9875\u9762\u6807\u9898"
        type: "text"
        default: "\u8054\u7cfb\u6211\u4eec"
      - name: "contactInfo"
        label: "\u8054\u7cfb\u4fe1\u606f"
        type: "repeater"
        itemTitle: "label"
        default:
          - label: "\u7535\u8bdd"
            icon: "fa-solid fa-phone"
            value: "400-888-8888"
          - label: "\u90ae\u7bb1"
            icon: "fa-solid fa-envelope"
            value: "info@example.com"
        fields:
          - name: "label"
            label: "\u540d\u79f0"
            type: "text"
          - name: "icon"
            label: "\u56fe\u6807"
            type: "text"
          - name: "value"
            label: "\u5185\u5bb9"
            type: "text"
