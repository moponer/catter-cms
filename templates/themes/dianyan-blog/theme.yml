name: 典雅 Blog
slug: dianyan-blog
version: 1.0.0
author: Catter
description: 新中式极简博客主题，融合东方美学与现代设计，适合个人博客和文学创作
require: 2.0.0

config:
  # 基础配置
  siteName: 典雅 Blog
  tagline: 墨香书韵，诗意栖居

  # 颜色配置（默认）
  primaryColor: "#2d5a4a"
  primaryLight: "#4a7c6f"
  accentColor: "#b8860b"
  textColor: "#1a1a1a"
  textSecondary: "#6b6b6b"
  bgColor: "#f8f5f0"
  bgSecondary: "#fefcf9"
  borderColor: "#e8e4df"

  # 布局配置
  sidebarPosition: right
  postListStyle: card
  showExcerpt: true
  showViews: true
  showReadTime: true
  showTags: true
  showComments: true

  # 侧边栏模块
  sidebarWidgets:
    - profile
    - categories
    - tags

  # SEO配置
  metaDescription: 墨香书韵，诗意栖居 - 分享生活与技术
  customHeadCode: ""

configDefinition:
  - section: basic
    label: 基础设置
    icon: "fa-solid fa-gear"
    fields:
      - name: tagline
        label: 标语
        type: text
        default: 墨香书韵，诗意栖居

  - section: colors
    label: 颜色配置
    icon: "fa-solid fa-palette"
    fields:
      - name: primaryColor
        label: 主色调（翡翠绿）
        type: color
        default: "#2d5a4a"
      - name: primaryLight
        label: 浅主色
        type: color
        default: "#4a7c6f"
      - name: accentColor
        label: 强调色（古铜金）
        type: color
        default: "#b8860b"

  - section: text
    label: 文字颜色
    icon: "fa-solid fa-font"
    fields:
      - name: textColor
        label: 主文字颜色
        type: color
        default: "#1a1a1a"
      - name: textSecondary
        label: 次要文字
        type: color
        default: "#6b6b6b"

  - section: background
    label: 背景设置
    icon: "fa-solid fa-paintbrush"
    fields:
      - name: bgColor
        label: 主背景色
        type: color
        default: "#f8f5f0"
      - name: bgSecondary
        label: 卡片背景色
        type: color
        default: "#fefcf9"
      - name: borderColor
        label: 边框颜色
        type: color
        default: "#e8e4df"

  - section: layout
    label: 布局设置
    icon: "fa-solid fa-layout"
    fields:
      - name: sidebarPosition
        label: 侧边栏位置
        type: select
        default: right
        options:
          - label: 左侧
            value: left
          - label: 右侧
            value: right
      - name: postListStyle
        label: 文章列表样式
        type: select
        default: card
        options:
          - label: 卡片式
            value: card
          - label: 列表式
            value: list
          - label: 杂志式
            value: magazine
      - name: showExcerpt
        label: 显示文章摘要
        type: switch
        default: true
      - name: showViews
        label: 显示阅读量
        type: switch
        default: true
      - name: showReadTime
        label: 显示阅读时间
        type: switch
        default: true
      - name: showTags
        label: 显示标签
        type: switch
        default: true
      - name: showComments
        label: 显示评论数
        type: switch
        default: true

  - section: sidebar
    label: 侧边栏模块
    icon: "fa-solid fa-sidebar"
    fields:
      - name: sidebarWidgets
        label: 侧边栏模块
        type: checkbox
        default: '["profile","categories","tags"]'
        options:
          - label: 博主信息
            value: profile
          - label: 文章分类
            value: categories
          - label: 标签云
            value: tags
      - name: authorName
        label: 博主名称
        type: text
        default: 墨香居士
      - name: authorBio
        label: 博主简介
        type: textarea
        default: 墨香书韵，诗意栖居
      - name: authorAvatar
        label: 博主头像
        type: image
        default: https://picsum.photos/seed/avatar/200/200
      - name: socialLinks
        label: 社交链接
        type: repeater
        itemTitle: 链接
        default: '[]'
        fields:
          - name: label
            label: 显示名称
            type: text
            default: ""
          - name: url
            label: 链接地址
            type: text
            default: "#"
          - name: icon
            label: 图标
            type: text
            default: "link"
            description: "可用图标: link, github, weibo, wechat, email, twitter, facebook"

  - section: seo
    label: SEO设置
    icon: "fa-solid fa-magnifying-glass"
    fields:
      - name: metaDescription
        label: 首页描述
        type: textarea
        rows: 3
        default: 墨香书韵，诗意栖居 - 分享生活与技术
      - name: customHeadCode
        label: 自定义头部代码
        type: code
        rows: 4
