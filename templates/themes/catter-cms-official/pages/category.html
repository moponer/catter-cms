<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .site.title }} - {{ .category.Name }}</title>
<link rel="stylesheet" href="/fontawesome/css/all.min.css">
<link rel="stylesheet" href="{{ asset_path "assets/css/base.css" }}">
<link rel="stylesheet" href="{{ asset_path "assets/css/list.css" }}">
</head>
<body>
<header>
<div class="header-container">
<a href="/" class="logo">{{ .site.title }}<span>CMS</span></a>
<nav>
<a href="/">首页</a>
<a href="/article">文章</a>
<a href="/categories">分类</a>
<a href="/tags">标签</a>
</nav>
</div>
</header>

<div class="page-header">
<h1>{{ .category.Name }}</h1>
<p>共 {{ len .posts }} 篇文章</p>
</div>

<main class="posts-container">
{{ range .posts }}
<article class="post-card">
<h3><a href="/article/{{ .Slug }}">{{ .Title }}</a></h3>
<div class="post-meta"><i class="fa-solid fa-calendar"></i> {{ if .PublishedAt }}{{ .PublishedAt.Format "2006-01-02" }}{{ end }}</div>
<p>{{ .Excerpt }}</p>
</article>
{{ end }}
</main>

<footer>
<p>&copy; 2026 {{ .site.title }}</p>
</footer>
</body>
</html>
