<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .site.title }} - {{ .pageTitle }}</title>
    <meta name="description" content="{{ .page.MetaDescription }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a2e; background: #f8f9fa; }
        a { text-decoration: none; color: inherit; }

        header { background: linear-gradient(135deg, #0f3460 0%, #16213e 100%); color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8em; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: #e94560; }
        nav { display: flex; gap: 30px; }
        nav a { color: white; opacity: 0.9; transition: opacity 0.3s; font-weight: 500; }
        nav a:hover { opacity: 1; }
        .cta-btn { background: #e94560; color: white; padding: 10px 24px; border-radius: 6px; font-weight: 600; }

        .page-header { background: linear-gradient(135deg, #0f3460 0%, #16213e 100%); color: white; padding: 80px 30px; text-align: center; }
        .page-header h1 { font-size: 2.8em; margin-bottom: 15px; }
        .page-header p { font-size: 1.2em; opacity: 0.9; max-width: 600px; margin: 0 auto; }

        .page-content { max-width: 900px; margin: 80px auto; padding: 0 30px; }
        .page-content h2 { font-size: 2em; color: #0f3460; margin: 50px 0 20px; }
        .page-content h3 { font-size: 1.5em; color: #0f3460; margin: 40px 0 15px; }
        .page-content p { margin: 15px 0; color: #4a5568; line-height: 1.8; font-size: 1.1em; }
        .page-content ul, .page-content ol { margin: 20px 0; padding-left: 30px; }
        .page-content li { margin: 10px 0; color: #4a5568; line-height: 1.8; }
        .page-content pre { background: #1a202c; color: #e2e8f0; padding: 20px; border-radius: 8px; overflow-x: auto; margin: 20px 0; }
        .page-content code { background: #edf2f7; padding: 2px 6px; border-radius: 4px; font-family: 'Fira Code', monospace; }
        .page-content pre code { background: none; padding: 0; }

        /* Contact form */
        .contact-form { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-top: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0f3460; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 1em; font-family: inherit; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-group button { background: #e94560; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; }
        .form-group button:hover { background: #d63850; }

        footer { background: #0f0f1a; color: #9ca3af; padding: 60px 30px; margin-top: 80px; }
        .footer-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; }
        footer h4 { color: white; margin-bottom: 20px; }
        footer a { display: block; padding: 5px 0; color: #9ca3af; transition: color 0.3s; }
        footer a:hover { color: #e94560; }
        .footer-bottom { max-width: 1200px; margin: 40px auto 0; padding-top: 30px; border-top: 1px solid #374151; text-align: center; }

        @media (max-width: 768px) {
            .header-container { flex-direction: column; gap: 15px; }
            nav { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .page-header h1 { font-size: 2em; }
            .page-content { margin: 40px auto; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">{{ .site.title }}<span>CMS</span></a>
            <nav>
                <a href="/page/features">功能</a>
                <a href="/page/pricing">定价</a>
                <a href="/page/docs">文档</a>
                <a href="/article">博客</a>
                <a href="/page/about">关于</a>
            </nav>
            <a href="/page/contact" class="cta-btn">联系我们</a>
        </div>
    </header>

    <div class="page-header">
        <h1>{{ .page.Title }}</h1>
        {{ if .page.Excerpt }}
        <p>{{ .page.Excerpt }}</p>
        {{ end }}
    </div>

    <div class="page-content">
        {{ markdownHTML .page.Content }}
    </div>

    <footer>
        <div class="footer-container">
            <div>
                <h4>{{ .site.title }} CMS</h4>
                <p>现代化的开源内容管理系统</p>
            </div>
            <div>
                <h4>产品</h4>
                <a href="/page/features">功能介绍</a>
                <a href="/page/pricing">定价方案</a>
                <a href="/article">博客更新</a>
            </div>
            <div>
                <h4>资源</h4>
                <a href="/page/docs">开发文档</a>
                <a href="/article">技术博客</a>
            </div>
            <div>
                <h4>关于</h4>
                <a href="/page/about">关于我们</a>
                <a href="/page/contact">联系我们</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; {{ .site.year }} {{ .site.title }}. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
