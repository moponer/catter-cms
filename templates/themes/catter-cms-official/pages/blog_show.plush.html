<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= post.Title %> - <%= site["title"] %></title>
    <meta name="description" content="<%= post.Excerpt %>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            line-height: 1.6;
            color: #1a1a2e;
            background: #f8f9fa;
        }
        
        header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8em;
            font-weight: 800;
        }
        
        .logo span {
            color: #e94560;
        }
        
        nav a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            margin-left: 40px;
            font-weight: 500;
        }
        
        .article-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 30px;
        }
        
        .article {
            background: white;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .article-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .article-header h1 {
            font-size: 2.5em;
            line-height: 1.3;
            color: #0f3460;
            margin-bottom: 20px;
        }
        
        .article-meta {
            display: flex;
            gap: 20px;
            color: #6b7280;
        }
        
        .article-content {
            font-size: 1.1em;
            line-height: 1.9;
            color: #374151;
        }
        
        .article-content h2 {
            margin: 40px 0 20px;
            color: #0f3460;
            font-size: 1.8em;
        }
        
        .article-content p {
            margin-bottom: 20px;
        }
        
        .article-content pre {
            background: #1a1a2e;
            color: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }
        
        .article-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        footer {
            background: #0f3460;
            color: white;
            padding: 40px 30px;
            text-align: center;
            margin-top: 60px;
        }
        
        footer p {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Catter<span>CMS</span></div>
            <nav>
                <a href="/">首页</a>
                <a href="/features">功能</a>
                <a href="/blog">新闻</a>
                <a href="/about">关于</a>
            </nav>
        </div>
    </header>
    
    <main class="article-container">
        <article class="article">
            <header class="article-header">
                <h1><%= post.Title %></h1>
                <div class="article-meta">
                    <span>📅 <%= post.PublishedAt %></span>
                    <span>👁 <%= post.Views %> 阅读</span>
                </div>
            </header>
            
            <div class="article-content">
                <%= post.Content %>
            </div>
        </article>
    </main>
    
    <footer>
        <p>&copy; 2026 <%= site["title"] %>. All Rights Reserved.</p>
    </footer>
</body>
</html>
