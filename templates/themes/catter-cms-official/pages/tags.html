<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .site.title }} - {{ .pageTitle }}</title>
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="{{ asset_path "assets/css/base.css" }}">
    <link rel="stylesheet" href="{{ asset_path "assets/css/list.css" }}">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">{{ .site.title }}<span>CMS</span></a>
            <nav>
                <a href="/">首页</a>
                <a href="/article">文章</a>
                <a href="/categories">分类</a>
                <a href="/tags" class="active">标签</a>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <h1>标签云</h1>
    </section>

    <div class="main-container">
        <div class="tags-cloud">
            {{ if gt (len .tags) 0 }}
            {{ range .tags }}
            <a href="/tag/{{ .Slug }}" class="tag-item">
                <span>{{ .Name }}</span>
                <span class="tag-count">{{ .PostCount }}</span>
            </a>
            {{ end }}
            {{ else }}
            <div class="empty-state">
                <p>暂无标签</p>
            </div>
            {{ end }}
        </div>
    </div>

    <footer>
        <p>&copy; 2026 {{ .site.title }}. All Rights Reserved.</p>
    </footer>
</body>
</html>
