<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .site.title }} - {{ .tag.Name }}</title>
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="{{ asset_path "assets/css/base.css" }}">
    <link rel="stylesheet" href="{{ asset_path "assets/css/list.css" }}">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">{{ .site.title }}<span>CMS</span></a>
            <nav>
                <a href="/">首页</a>
                <a href="/article">文章</a>
                <a href="/categories">分类</a>
                <a href="/tags">标签</a>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <h1>{{ .tag.Name }}</h1>
        <p>标签下的所有文章</p>
    </section>

    <div class="main-container">
        <main class="posts-section">
            {{ if gt (len .posts) 0 }}
            {{ range .posts }}
            <article class="post-card">
                <h2><a href="/article/{{ .Slug }}">{{ .Title }}</a></h2>
                <div class="post-meta">
                    {{ if .PublishedAt }}<span><i class="fa-solid fa-calendar"></i> {{ .PublishedAt.Format "2006-01-02" }}</span>{{ end }}
                    <span><i class="fa-solid fa-eye"></i> {{ .Views }} 阅读</span>
                </div>
            </article>
            {{ end }}
            {{ else }}
            <div class="empty-state">
                <p>该标签下暂无文章</p>
            </div>
            {{ end }}
        </main>
    </div>

    <footer>
        <p>&copy; 2026 {{ .site.title }}. All Rights Reserved.</p>
    </footer>
</body>
</html>
