name: Catter CMS Official
slug: catter-cms-official
version: 2.0.0
author: Catter CMS Team
description: Catter CMS 开源官网主题，Terminal 风格，MIT 开源精神

config:
  # ===== 颜色配置（绿色系，无蓝色）=====
  primaryColor: "#10B981"
  primaryDark: "#059669"
  primaryDarker: "#047857"
  accent: "#F59E0B"
  bgPrimary: "#F9FAFB"
  bgSecondary: "#FFFFFF"
  bgDark: "#0F172A"
  textPrimary: "#1E293B"
  textSecondary: "#64748B"
  textMuted: "#94A3B8"
  borderColor: "#E2E8F0"
  success: "#10B981"

  # ===== Hero 区域 =====
  heroEnabled: true
  heroTitle: "Catter CMS"
  heroSubtitle: "开源、模块化、AI 驱动的内容管理系统"

  # ===== 截图展示 =====
  showcaseEnabled: true
  showcaseTitle: "界面预览"
  showcaseDescription: "管理后台截图展示"
  showcaseImages: "[]"

  # ===== Footer =====
  footerEnabled: true
  footerCopyright: "2026 Catter CMS. All rights reserved."
  footerICP: ""

  # ===== 自定义代码 =====
  customCss: ""
  customJs: ""

configDefinition:
  - section: 颜色设置
    fields:
      - name: primaryColor
        type: color
        label: 主色调
        default: "#10B981"
      - name: primaryDark
        type: color
        label: 深主色调
        default: "#059669"
      - name: primaryDarker
        type: color
        label: 更深主色调
        default: "#047857"
      - name: accent
        type: color
        label: 强调色
        default: "#F59E0B"
      - name: bgPrimary
        type: color
        label: 主背景色
        default: "#F9FAFB"
      - name: bgSecondary
        type: color
        label: 次背景色
        default: "#FFFFFF"
      - name: bgDark
        type: color
        label: 深色背景
        default: "#0F172A"
      - name: textPrimary
        type: color
        label: 主文字色
        default: "#1E293B"
      - name: textSecondary
        type: color
        label: 次文字色
        default: "#64748B"
      - name: textMuted
        type: color
        label: 弱化文字色
        default: "#94A3B8"
      - name: borderColor
        type: color
        label: 边框色
        default: "#E2E8F0"

  - section: 页脚
    fields:
      - name: footerEnabled
        type: switch
        label: 显示页脚
        default: true
      - name: footerCopyright
        type: text
        label: 版权信息
        show_if: "footerEnabled == true"
        default: "2026 Catter CMS. All rights reserved."
      - name: footerICP
        type: text
        label: ICP 备案号
        show_if: "footerEnabled == true"
        default: ""

  - section: SEO 设置
    fields:
      - name: metaTitle
        type: text
        label: 首页标题
        default: ""
      - name: metaKeywords
        type: text
        label: 关键词
        default: ""
      - name: metaDescription
        type: textarea
        label: 描述
        default: ""
      - name: ogImage
        type: image
        label: Open Graph 图片
        default: ""

  - section: 截图展示
    fields:
      - name: showcaseEnabled
        type: switch
        label: 显示截图展示区
        default: true
      - name: showcaseTitle
        type: text
        label: 标题
        show_if: "showcaseEnabled == true"
        default: "界面预览"
      - name: showcaseDescription
        type: text
        label: 描述
        show_if: "showcaseEnabled == true"
        default: "管理后台截图展示"
      - name: showcaseImages
        type: image-list
        label: 截图列表
        show_if: "showcaseEnabled == true"
        default: "[]"

  - section: 自定义代码
    fields:
      - name: customCss
        type: textarea
        label: 自定义 CSS
        default: ""
      - name: customJs
        type: textarea
        label: 自定义 JavaScript
        default: ""
