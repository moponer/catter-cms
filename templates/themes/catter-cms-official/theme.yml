name: Catter CMS Official
slug: catter-cms-official
version: 2.0.0
author: Catter CMS Team
description: Catter CMS 开源官网主题，展示四大自由与核心特性

config:
  # ===== 颜色配置（绿色系，无蓝色）=====
  primaryColor: "#10B981"
  primaryDark: "#059669"
  primaryDarker: "#047857"
  accent: "#F59E0B"
  bgPrimary: "#F9FAFB"
  bgSecondary: "#FFFFFF"
  bgDark: "#0F172A"
  textPrimary: "#1E293B"
  textSecondary: "#64748B"
  textMuted: "#94A3B8"
  borderColor: "#E2E8F0"
  success: "#10B981"

  # ===== Hero 区域 =====
  heroEnabled: true
  heroTitle: "Catter CMS"
  heroSubtitle: "开源、模块化、AI 驱动的内容管理系统"
  heroDescription: "四大自由：内容自由、主题自由、AI 集成、管理自由。让每个人都能轻松搭建专业网站。"
  heroButtonText: "快速开始"
  heroButtonLink: "/page/getting-started"
  heroSecondaryText: "查看文档"
  heroSecondaryLink: "/page/docs"

  # ===== 四大自由模块 =====
  freedomsEnabled: true
  freedoms: '[{"icon":"fa-solid fa-pen-nib","title":"内容自由","desc":"富文本编辑器、Markdown 支持、定时发布、分类标签，让创作随心所欲"},{"icon":"fa-solid fa-palette","title":"主题自由","desc":"可视化主题市场，一键切换风格，支持自定义开发，打造独一无二的网站"},{"icon":"fa-solid fa-robot","title":"AI 集成","desc":"内置 AI 写作助手，智能生成内容，OpenAPI 接口开放，无限扩展可能"},{"icon":"fa-solid fa-sliders","title":"管理自由","desc":" intuitive 管理后台，用户权限、媒体库、菜单管理、定时任务，一切尽在掌握"}]'

  # ===== 功能特性模块 =====
  featuresEnabled: true
  features: '[{"icon":"fa-solid fa-bolt","title":"高性能","desc":"基于 Go 语言开发，支持高并发访问，响应速度毫秒级"},{"icon":"fa-solid fa-puzzle-piece","title":"模块化","desc":"丰富的模块市场，一键安装扩展功能，灵活组合满足各种需求"},{"icon":"fa-solid fa-shield-halved","title":"安全可靠","desc":"XSS 防护、CSRF 令牌、安全响应头、参数化查询，多重安全保障"},{"icon":"fa-solid fa-cloud-arrow-up","title":"单文件部署","desc":"前后端编译为单一可执行文件，上传即可运行，无需复杂环境配置"},{"icon":"fa-solid fa-code","title":"开放 API","desc":"RESTful API 设计，支持第三方集成，AI Skill 文档自动生成"},{"icon":"fa-solid fa-mobile-screen","title":"响应式设计","desc":"移动端优先，自适应各种屏幕尺寸，用户体验始终如一"}]'

  # ===== 技术栈展示 =====
  techStackEnabled: true
  techStack: '[{"name":"Go / Gin","desc":"高性能后端框架","icon":"fa-solid fa-server"},{"name":"Vue 3","desc":"现代化前端框架","icon":"fa-solid fa-code"},{"name":"SQLite","desc":"轻量级数据库","icon":"fa-solid fa-database"},{"name":"Element Plus","desc":"企业级 UI 组件库","icon":"fa-solid fa-layer-group"}]'

  # ===== 主题展示模块 =====
  themeShowcaseEnabled: true
  themeShowcaseTitle: "精美主题，随心选择"
  themeShowcaseDesc: "内置多款精心设计的主题，覆盖博客、企业官网、物流等多种场景"

  # ===== 快速开始模块 =====
  quickstartEnabled: true
  quickstartTitle: "快速开始"
  quickstartDesc: "三步搭建您的专属网站"
  quickstartSteps: '[{"step":1,"title":"下载安装","desc":"下载 Catter CMS，解压后运行可执行文件，开箱即用"},{"step":2,"title":"选择主题","desc":"进入管理后台，选择喜欢的主题并配置"},{"step":3,"title":"发布内容","desc":"创建文章和页面，使用 AI 辅助写作，一键发布"}]'
  quickstartButtonText: "立即下载"
  quickstartButtonLink: "/page/download"

  # ===== Footer =====
  footerEnabled: true
  footerCopyright: "2026 Catter CMS. All rights reserved."
  footerICP: ""

  # ===== 自定义代码 =====
  customCss: ""
  customJs: ""

configDefinition:
  - section: 颜色设置
    fields:
      - name: primaryColor
        type: color
        label: 主色调
        default: "#10B981"
      - name: primaryDark
        type: color
        label: 深主色调
        default: "#059669"
      - name: primaryDarker
        type: color
        label: 更深主色调
        default: "#047857"
      - name: accent
        type: color
        label: 强调色
        default: "#F59E0B"
      - name: bgPrimary
        type: color
        label: 主背景色
        default: "#F9FAFB"
      - name: bgSecondary
        type: color
        label: 次背景色
        default: "#FFFFFF"
      - name: bgDark
        type: color
        label: 深色背景
        default: "#0F172A"
      - name: textPrimary
        type: color
        label: 主文字色
        default: "#1E293B"
      - name: textSecondary
        type: color
        label: 次文字色
        default: "#64748B"
      - name: textMuted
        type: color
        label: 弱化文字色
        default: "#94A3B8"
      - name: borderColor
        type: color
        label: 边框色
        default: "#E2E8F0"

  - section: Hero 模块
    fields:
      - name: heroEnabled
        type: switch
        label: 显示 Hero 区域
        default: true
      - name: heroTitle
        type: text
        label: 主标题
        show_if: "heroEnabled == true"
        default: "Catter CMS"
      - name: heroSubtitle
        type: text
        label: 副标题
        show_if: "heroEnabled == true"
        default: "开源、模块化、AI 驱动的内容管理系统"
      - name: heroDescription
        type: textarea
        label: 描述
        show_if: "heroEnabled == true"
        default: "四大自由：内容自由、主题自由、AI 集成、管理自由。让每个人都能轻松搭建专业网站。"
      - name: heroButtonText
        type: text
        label: 主按钮文字
        show_if: "heroEnabled == true"
        default: "快速开始"
      - name: heroButtonLink
        type: text
        label: 主按钮链接
        show_if: "heroEnabled == true"
        default: "/page/getting-started"
      - name: heroSecondaryText
        type: text
        label: 次要按钮文字
        show_if: "heroEnabled == true"
        default: "查看文档"
      - name: heroSecondaryLink
        type: text
        label: 次要按钮链接
        show_if: "heroEnabled == true"
        default: "/page/docs"

  - section: 四大自由模块
    fields:
      - name: freedomsEnabled
        type: switch
        label: 显示四大自由区域
        default: true
      - name: freedoms
        type: repeater
        label: 自由列表
        itemTitle: title
        show_if: "freedomsEnabled == true"
        fields:
          - name: icon
            type: text
            label: 图标 (FontAwesome class)
            default: ""
          - name: title
            type: text
            label: 标题
            default: ""
          - name: desc
            type: textarea
            label: 描述
            default: ""

  - section: 功能特性模块
    fields:
      - name: featuresEnabled
        type: switch
        label: 显示功能特性区域
        default: true
      - name: features
        type: repeater
        label: 特性列表
        itemTitle: title
        show_if: "featuresEnabled == true"
        fields:
          - name: icon
            type: text
            label: 图标 (FontAwesome class)
            default: ""
          - name: title
            type: text
            label: 标题
            default: ""
          - name: desc
            type: textarea
            label: 描述
            default: ""

  - section: 技术栈展示
    fields:
      - name: techStackEnabled
        type: switch
        label: 显示技术栈区域
        default: true
      - name: techStack
        type: repeater
        label: 技术列表
        itemTitle: name
        show_if: "techStackEnabled == true"
        fields:
          - name: name
            type: text
            label: 技术名称
            default: ""
          - name: desc
            type: text
            label: 描述
            default: ""
          - name: icon
            type: text
            label: 图标 (FontAwesome class)
            default: ""

  - section: 主题展示模块
    fields:
      - name: themeShowcaseEnabled
        type: switch
        label: 显示主题展示区域
        default: true
      - name: themeShowcaseTitle
        type: text
        label: 标题
        show_if: "themeShowcaseEnabled == true"
        default: "精美主题，随心选择"
      - name: themeShowcaseDesc
        type: text
        label: 描述
        show_if: "themeShowcaseEnabled == true"
        default: "内置多款精心设计的主题，覆盖博客、企业官网、物流等多种场景"

  - section: 快速开始模块
    fields:
      - name: quickstartEnabled
        type: switch
        label: 显示快速开始区域
        default: true
      - name: quickstartTitle
        type: text
        label: 标题
        show_if: "quickstartEnabled == true"
        default: "快速开始"
      - name: quickstartDesc
        type: text
        label: 描述
        show_if: "quickstartEnabled == true"
        default: "三步搭建您的专属网站"
      - name: quickstartSteps
        type: repeater
        label: 步骤列表
        itemTitle: title
        show_if: "quickstartEnabled == true"
        fields:
          - name: step
            type: number
            label: 步骤序号
            default: 1
          - name: title
            type: text
            label: 标题
            default: ""
          - name: desc
            type: textarea
            label: 描述
            default: ""
      - name: quickstartButtonText
        type: text
        label: 按钮文字
        show_if: "quickstartEnabled == true"
        default: "立即下载"
      - name: quickstartButtonLink
        type: text
        label: 按钮链接
        show_if: "quickstartEnabled == true"
        default: "/page/download"

  - section: 页脚
    fields:
      - name: footerEnabled
        type: switch
        label: 显示页脚
        default: true
      - name: footerCopyright
        type: text
        label: 版权信息
        show_if: "footerEnabled == true"
        default: "2026 Catter CMS. All rights reserved."
      - name: footerICP
        type: text
        label: ICP 备案号
        show_if: "footerEnabled == true"
        default: ""

  - section: SEO 设置
    fields:
      - name: metaTitle
        type: text
        label: 首页标题
        default: ""
      - name: metaKeywords
        type: text
        label: 关键词
        default: ""
      - name: metaDescription
        type: textarea
        label: 描述
        default: ""
      - name: ogImage
        type: image
        label: Open Graph 图片
        default: ""

  - section: 自定义代码
    fields:
      - name: customCss
        type: textarea
        label: 自定义 CSS
        default: ""
      - name: customJs
        type: textarea
        label: 自定义 JavaScript
        default: ""
