name: Catter CMS Official
slug: catter-cms-official
version: 1.0.0
author: Catter
description: 官方CMS主题，适合企业官网和内容展示网站

config:
  # ===== 颜色配置 =====
  primaryColor: "#0f3460"
  primaryDark: "#0f3460"
  primaryDarker: "#16213e"
  accent: "#e94560"
  bgPrimary: "#f8f9fa"
  bgSecondary: "#ffffff"
  textPrimary: "#1a1a2e"
  textSecondary: "#6b7280"
  textMuted: "#9ca3af"
  borderColor: "#e5e7eb"
  success: "#10b981"

  # ===== 字体配置 =====
  baseFont: "system-ui, -apple-system, sans-serif"
  headingFont: "system-ui, -apple-system, sans-serif"

  # ===== 导航设置 =====
  navStyle: "solid"

  # ===== Hero 区域 =====
  heroEnabled: true
  heroTitle: Catter CMS
  heroSubtitle: 现代化、模块化、易扩展的内容管理系统
  heroButtonText: 开始使用
  heroButtonLink: "/download"
  heroImage: ""

  # ===== 首页模块开关 =====
  moduleStatsEnabled: true
  moduleFeaturesEnabled: true
  moduleProductsEnabled: true
  modulePricingEnabled: true
  moduleTestimonialsEnabled: true
  moduleCtaEnabled: true

  # ===== Features 特性（数组）=====
  features: '[{"icon":"lightning","title":"高性能","desc":"基于Go语言开发，支持高并发访问"},{"icon":"puzzle","title":"模块化","desc":"丰富的模块市场，一键安装扩展功能"},{"icon":"paintbrush","title":"主题市场","desc":"多种精美主题模板，轻松打造个性化网站"},{"icon":"shield","title":"安全可靠","desc":"多重安全防护，数据自动备份"}]'

  # ===== Stats 统计数据（数组）=====
  stats: '[{"value":"10K+","label":"用户"},{"value":"50+","label":"主题"},{"value":"100+","label":"模块"},{"value":"99%","label":"满意度"}]'

  # ===== Products 产品展示（数组）=====
  products: '[{"name":"Catter Blog","desc":"个人博客主题","link":"/themes/blog","image":""},{"name":"Enterprise","desc":"企业官网主题","link":"/themes/enterprise","image":""},{"name":"Store","desc":"商城主题","link":"/themes/store","image":""}]'

  # ===== Pricing 价格方案（数组）=====
  pricing: '[{"name":"免费版","price":"0","period":"永久","features":["3个页面","5篇文章","基础主题","邮件支持"],"button":"免费使用","link":"/pricing/free"},{"name":"专业版","price":"299","period":"/年","features":["无限页面","无限文章","全部主题","优先支持","数据备份"],"button":"立即购买","link":"/pricing/pro","recommended":true},{"name":"企业版","price":"999","period":"/年","features":["全部功能","私有部署","专属客服","定制开发","SLA保障"],"button":"联系我们","link":"/pricing/enterprise"}]'

  # ===== Testimonials 用户评价（数组）=====
  testimonials: '[{"name":"张三","title":"技术总监","content":"使用Catter CMS后，我们的内容发布效率提升了3倍","avatar":""},{"name":"李四","title":"产品经理","content":"模块化设计非常灵活，满足了我们各种定制化需求","avatar":""},{"name":"王五","title":"个人博主","content":"主题美观大方，配置简单，SEO效果很好","avatar":""}]'

  # ===== CTA 区域 =====
  ctaEnabled: true
  ctaTitle: 准备好开始了吗
  ctaSubtitle: 立即体验Catter CMS，开启您的内容管理新体验
  ctaButtonText: 立即开始
  ctaButtonLink: "/download"

  # ===== Footer =====
  footerEnabled: true
  footerCopyright: "2024 Catter CMS. All rights reserved."
  footerICP: ""
  footerLinks: '[{"text":"产品","link":"/product"},{"text":"文档","link":"/docs"},{"text":"主题","link":"/themes"},{"text":"模块","link":"/modules"},{"text":"关于","link":"/about"}]'
  footerSocial: '[{"icon":"github","link":"#"},{"icon":"twitter","link":"#"}]'

  # ===== 自定义代码 =====
  customCss: ""
  customJs: ""

configDefinition:
  - section: 颜色设置
    fields:
      - name: primaryColor
        type: color
        label: 主色调
        default: "#0f3460"
      - name: primaryDark
        type: color
        label: 深主色调
        default: "#0f3460"
      - name: primaryDarker
        type: color
        label: 更深主色调
        default: "#16213e"
      - name: accent
        type: color
        label: 强调色
        default: "#e94560"
      - name: bgPrimary
        type: color
        label: 主背景色
        default: "#f8f9fa"
      - name: bgSecondary
        type: color
        label: 次背景色
        default: "#ffffff"
      - name: textPrimary
        type: color
        label: 主文字色
        default: "#1a1a2e"
      - name: textSecondary
        type: color
        label: 次文字色
        default: "#6b7280"
      - name: textMuted
        type: color
        label: 弱化文字色
        default: "#9ca3af"
      - name: borderColor
        type: color
        label: 边框色
        default: "#e5e7eb"

  - section: 字体设置
    fields:
      - name: baseFont
        type: text
        label: 基础字体
        default: "system-ui, -apple-system, sans-serif"
      - name: headingFont
        type: text
        label: 标题字体
        default: "system-ui, -apple-system, sans-serif"

  - section: 导航设置
    fields:
      - name: navStyle
        type: select
        label: 导航栏样式
        options:
          - value: solid
            label: 实色背景
          - value: transparent
            label: 透明背景
        default: solid

  - section: Hero模块
    fields:
      - name: heroEnabled
        type: switch
        label: 显示Hero区域
        default: true
      - name: heroTitle
        type: text
        label: 主标题
        show_if: "heroEnabled == true"
        default: Catter CMS
      - name: heroSubtitle
        type: text
        label: 副标题
        show_if: "heroEnabled == true"
        default: 现代化、模块化、易扩展的内容管理系统
      - name: heroButtonText
        type: text
        label: 按钮文字
        show_if: "heroEnabled == true"
        default: 开始使用
      - name: heroButtonLink
        type: text
        label: 按钮链接
        show_if: "heroEnabled == true"
        default: /download

  - section: 统计数据
    fields:
      - name: moduleStatsEnabled
        type: switch
        label: 显示统计数据区域
        default: true
      - name: stats
        type: repeater
        label: 统计数据
        itemTitle: label
        show_if: "moduleStatsEnabled == true"
        fields:
          - name: value
            type: text
            label: 数值
            default: ""
          - name: label
            type: text
            label: 标签
            default: ""

  - section: 特性介绍
    fields:
      - name: moduleFeaturesEnabled
        type: switch
        label: 显示特性介绍区域
        default: true
      - name: features
        type: repeater
        label: 特性列表
        itemTitle: title
        show_if: "moduleFeaturesEnabled == true"
        fields:
          - name: icon
            type: text
            label: 图标
            default: ""
          - name: title
            type: text
            label: 标题
            default: ""
          - name: desc
            type: textarea
            label: 描述
            default: ""

  - section: 产品展示
    fields:
      - name: moduleProductsEnabled
        type: switch
        label: 显示产品展示区域
        default: true
      - name: products
        type: repeater
        label: 产品列表
        itemTitle: name
        show_if: "moduleProductsEnabled == true"
        fields:
          - name: name
            type: text
            label: 产品名称
            default: ""
          - name: desc
            type: textarea
            label: 产品描述
            default: ""
          - name: link
            type: text
            label: 链接
            default: ""
          - name: image
            type: image
            label: 图片
            default: ""

  - section: 价格方案
    fields:
      - name: modulePricingEnabled
        type: switch
        label: 显示价格方案区域
        default: true
      - name: pricing
        type: repeater
        label: 价格方案
        itemTitle: name
        show_if: "modulePricingEnabled == true"
        fields:
          - name: name
            type: text
            label: 方案名称
            default: ""
          - name: price
            type: text
            label: 价格
            default: ""
          - name: period
            type: text
            label: 周期
            default: ""
          - name: features
            type: textarea
            label: 特性列表（每行一个）
            default: ""
          - name: button
            type: text
            label: 按钮文字
            default: ""
          - name: link
            type: text
            label: 链接
            default: ""
          - name: recommended
            type: switch
            label: 推荐方案
            default: false

  - section: 用户评价
    fields:
      - name: moduleTestimonialsEnabled
        type: switch
        label: 显示用户评价区域
        default: true
      - name: testimonials
        type: repeater
        label: 用户评价
        itemTitle: name
        show_if: "moduleTestimonialsEnabled == true"
        fields:
          - name: name
            type: text
            label: 姓名
            default: ""
          - name: title
            type: text
            label: 职位
            default: ""
          - name: content
            type: textarea
            label: 评价内容
            default: ""
          - name: avatar
            type: image
            label: 头像
            default: ""

  - section: CTA区域
    fields:
      - name: ctaEnabled
        type: switch
        label: 显示CTA区域
        default: true
      - name: ctaTitle
        type: text
        label: CTA标题
        show_if: "ctaEnabled == true"
        default: 准备好开始了吗
      - name: ctaSubtitle
        type: text
        label: CTA副标题
        show_if: "ctaEnabled == true"
        default: 立即体验Catter CMS，开启您的内容管理新体验
      - name: ctaButtonText
        type: text
        label: 按钮文字
        show_if: "ctaEnabled == true"
        default: 立即开始
      - name: ctaButtonLink
        type: text
        label: 按钮链接
        show_if: "ctaEnabled == true"
        default: /download

  - section: 页脚
    fields:
      - name: footerEnabled
        type: switch
        label: 显示页脚
        default: true
      - name: footerCopyright
        type: text
        label: 版权信息
        show_if: "footerEnabled == true"
        default: "2024 Catter CMS. All rights reserved."
      - name: footerICP
        type: text
        label: ICP备案号
        show_if: "footerEnabled == true"
        default: ""
      - name: footerLinks
        type: repeater
        label: 链接列表
        itemTitle: text
        show_if: "footerEnabled == true"
        fields:
          - name: text
            type: text
            label: 链接文字
            default: ""
          - name: link
            type: text
            label: 链接地址
            default: ""
      - name: footerSocial
        type: repeater
        label: 社交媒体
        itemTitle: icon
        show_if: "footerEnabled == true"
        fields:
          - name: icon
            type: select
            label: 图标
            default: ""
            options:
              - label: GitHub
                value: github
              - label: Twitter
                value: twitter
              - label: 微信
                value: wechat
              - label: 微博
                value: weibo
              - label: 邮箱
                value: email
          - name: link
            type: text
            label: 链接地址
            default: ""

  - section: SEO设置
    fields:
      - name: metaTitle
        type: text
        label: 首页标题
        default: ""
      - name: metaKeywords
        type: text
        label: 关键词
        default: ""
      - name: metaDescription
        type: textarea
        label: 描述
        default: ""
      - name: ogImage
        type: image
        label: Open Graph 图片
        default: ""

  - section: 自定义代码
    fields:
      - name: customCss
        type: textarea
        label: 自定义CSS
        default: ""
      - name: customJs
        type: textarea
        label: 自定义JavaScript
        default: ""
