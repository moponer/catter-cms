# ========================================
# Catter CMS Official 官网主题配置
# 版本: 2.1.0 (精简版)
# ========================================

# 主题基本信息
name: "Catter CMS Official"
version: "2.1.0"
apiVersion: "2.0"
description: "Catter CMS官方官网主题，现代化设计风格"
author: "Catter Team"
authorEmail: "support@cattercms.com"
authorUrl: "https://cattercms.com"
license: "MIT"
tags: ["official", "landing", "responsive", "modern"]
thumbnail: "assets/images/thumbnail.svg"

# 依赖要求
requires:
  buffalo: ">=0.18.0"
  catterCms: ">=2.0.0"

# 主题能力声明
capabilities:
  layouts: [default, landing, features, pricing, docs]
  modules: [hero, features, testimonials, pricing, cta, footer]
  widgets: [search, categories, tags, recent-posts]
  postFormats: [standard, video]
  customFields: true
  customTemplates: true
  colorSchemes: true
  darkMode: false

# ========================================
# 默认配置
# ========================================
config:
  # 外观配置
  appearance:
    colors:
      primary: "#0f3460"
      secondary: "#16213e"
      accent: "#e94560"
    typography:
      baseFont: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    layout:
      width: "1200px"

  # Hero模块
  modules:
    hero:
      enabled: true
      config:
        title: "Catter CMS"
        subtitle: "现代化的内容管理系统"
        backgroundType: "gradient"
        backgroundColor: "#0f3460"
        ctaText: "立即开始"
        ctaUrl: "/blog"
        showCta: true

  # 自定义代码
  custom:
    css: ""
    js: ""

# ========================================
# 配置定义(用于生成管理后台配置表单)
# ========================================
configDefinition:
  # 外观配置
  - section: "外观"
    icon: "palette"
    description: "配置主题颜色、字体等外观设置"
    fields:
      - name: "appearance.colors.primary"
        label: "主色调"
        type: "color"
        showAlpha: false
        default: "#0f3460"
        description: "网站的主色调"

      - name: "appearance.colors.secondary"
        label: "次要颜色"
        type: "color"
        showAlpha: false
        default: "#16213e"
        description: "次要颜色"

      - name: "appearance.colors.accent"
        label: "强调色"
        type: "color"
        showAlpha: false
        default: "#e94560"
        description: "用于按钮、链接等强调元素"

      - name: "appearance.layout.width"
        label: "内容宽度"
        type: "text"
        placeholder: "例如: 1200px"
        default: "1200px"

  # Hero模块
  - section: "Hero模块"
    icon: "view"
    description: "配置首页Hero区域"
    fields:
      - name: "modules.hero.enabled"
        label: "启用Hero模块"
        type: "switch"
        default: true

      - name: "modules.hero.config.title"
        label: "主标题"
        type: "text"
        default: "Catter CMS"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.subtitle"
        label: "副标题"
        type: "textarea"
        default: "现代化的内容管理系统"
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.showCta"
        label: "显示按钮"
        type: "switch"
        default: true
        show_if: "modules.hero.enabled"

      - name: "modules.hero.config.ctaText"
        label: "按钮文本"
        type: "text"
        default: "立即开始"
        show_if: "modules.hero.enabled && modules.hero.config.showCta"

      - name: "modules.hero.config.ctaUrl"
        label: "按钮链接"
        type: "text"
        default: "/page/pricing"
        placeholder: "例如: /page/pricing, /article"
        description: "点击按钮后跳转的目标地址"
        show_if: "modules.hero.enabled && modules.hero.config.showCta"

  # 自定义代码
  - section: "自定义代码"
    icon: "code"
    description: "添加自定义CSS和JavaScript代码"
    fields:
      - name: "custom.css"
        label: "自定义CSS"
        type: "code"
        language: "css"
        rows: 8

      - name: "custom.js"
        label: "自定义JavaScript"
        type: "code"
        language: "javascript"
        rows: 8

# 菜单位置定义
menuLocations:
  header:
    name: "顶部导航"
    description: "网站顶部主导航菜单"
    maxDepth: 3
  footer:
    name: "底部导航"
    description: "网站底部导航菜单"
    maxDepth: 2

# 小工具区域定义
widgetAreas:
  - id: "sidebar"
    name: "侧边栏"
    description: "侧边栏小工具区域"
    maxWidgets: 6

# 主题特定设置
settings:
  colorSchemes:
    - name: "default"
      label: "默认"
      colors:
        primary: "#0f3460"
        secondary: "#16213e"
        accent: "#e94560"
    - name: "modern"
      label: "现代"
      colors:
        primary: "#2563eb"
        secondary: "#1e40af"
        accent: "#f59e0b"
