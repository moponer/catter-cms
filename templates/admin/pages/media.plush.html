<div class="media-container">
    <el-row :gutter="20">
        <el-col :span="24">
            <el-card shadow="hover">
                <template #header>
                    <div class="card-header">
                        <i>📁</i>
                        <span>媒体管理</span>
                        <el-button type="primary" size="small" icon="el-icon-upload" @click="showUploadDialog">
                            上传文件
                        </el-button>
                    </div>
                </template>
                <div class="card-body">
                    <el-form :inline="true" :model="searchForm">
                        <el-form-item label="搜索">
                            <el-input v-model="searchForm.keyword" placeholder="请输入文件名" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="类型">
                            <el-select v-model="searchForm.type" placeholder="请选择类型" clearable>
                                <el-option label="全部" value=""></el-option>
                                <el-option label="图片" value="image"></el-option>
                                <el-option label="视频" value="video"></el-option>
                                <el-option label="文档" value="document"></el-option>
                                <el-option label="其他" value="other"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" icon="el-icon-search" @click="searchMedia">搜索</el-button>
                            <el-button icon="el-icon-refresh" @click="resetSearch">重置</el-button>
                        </el-form-item>
                    </el-form>
                    
                    <el-table 
                        :data="mediaFiles" 
                        style="width: 100%"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column prop="filename" label="文件名" min-width="200"></el-table-column>
                        <el-table-column prop="mime_type" label="类型" width="100">
                            <template #default="scope">
                                <el-tag :type="getTypeTag(scope.row.mime_type)">{{ getTypeLabel(scope.row.mime_type) }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="size" label="大小" width="120">
                            <template #default="scope">
                                {{ formatSize(scope.row.size) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="path" label="URL" min-width="300">
                            <template #default="scope">
                                <el-link :href="scope.row.path" target="_blank" type="primary">{{ scope.row.path }}</el-link>
                            </template>
                        </el-table-column>
                        <el-table-column prop="created_at" label="上传时间" width="180">
                            <template #default="scope">
                                {{ formatDate(scope.row.created_at) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="200" fixed="right">
                            <template #default="scope">
                                <el-button type="primary" size="small" icon="el-icon-view" @click="previewMedia(scope.row)">
                                    预览
                                </el-button>
                                <el-button type="danger" size="small" icon="el-icon-delete" @click="deleteMedia(scope.row)">
                                    删除
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                    
                    <el-pagination
                        v-model:current-page="pagination.page"
                        v-model:page-size="pagination.pageSize"
                        :total="pagination.total"
                        :page-sizes="[10, 20, 50, 100]"
                        layout="total, sizes, prev, pager, next, jumper"
                        @size-change="handleSizeChange"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                    
                    <div class="batch-actions" v-if="selectedMedia.length > 0">
                        <el-button type="danger" icon="el-icon-delete" @click="batchDelete">
                            批量删除 ({{ selectedMedia.length }})
                        </el-button>
                    </div>
                </div>
            </el-card>
        </el-col>
    </el-row>
    
    <el-dialog v-model="uploadDialogVisible" title="上传文件" width="50%" @close="uploadDialogVisible = false">
        <el-upload
            class="upload-demo"
            drag
            action="/admin/api/media/upload"
            multiple
            :on-success="handleUploadSuccess"
            :on-error="handleUploadError"
            :before-upload="beforeUpload">
            <el-icon class="el-icon--upload"><upload-filled /></el-icon>
            <div class="el-upload__text">
                将文件拖到此处，或<em>点击上传</em>
            </div>
            <template #tip>
                <div class="el-upload__tip">
                    支持jpg/png/gif/pdf/doc/docx等格式，单个文件不超过10MB
                </div>
            </template>
        </el-upload>
    </el-dialog>
    
    <el-dialog v-model="previewDialogVisible" title="媒体预览" width="80%" @close="previewDialogVisible = false">
        <div class="preview-container">
            <img v-if="previewType === 'image'" :src="previewUrl" style="max-width: 100%; max-height: 600px;">
            <video v-else-if="previewType === 'video'" :src="previewUrl" controls style="max-width: 100%; max-height: 600px;"></video>
            <div v-else>
                <el-alert title="无法预览此文件类型" type="info" :closable="false"></el-alert>
            </div>
        </div>
    </el-dialog>
</div>

<style>
    .media-container {
        padding: 20px;
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .batch-actions {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #ebeef5;
    }
    .preview-container {
        background: #f5f7fa;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
    }
</style>

<script>
    const { ref, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;
    const { UploadFilled } = ElementPlusIconsVue;
    
    const mediaFiles = ref([]);
    const selectedMedia = ref([]);
    const searchForm = ref({
        keyword: '',
        type: ''
    });
    
    const uploadDialogVisible = ref(false);
    const previewDialogVisible = ref(false);
    const previewUrl = ref('');
    const previewType = ref('');
    
    const pagination = ref({
        page: 1,
        pageSize: 10,
        total: 0
    });
    
    const formatDate = (date) => {
        return new Date(date).toLocaleString('zh-CN');
    };
    
    const formatSize = (bytes) => {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    };
    
    const getTypeLabel = (mimeType) => {
        if (mimeType.startsWith('image/')) {
            return '图片';
        } else if (mimeType.startsWith('video/')) {
            return '视频';
        } else if (mimeType.startsWith('application/') || mimeType.startsWith('text/')) {
            return '文档';
        }
        return '其他';
    };
    
    const getTypeTag = (mimeType) => {
        if (mimeType.startsWith('image/')) {
            return 'success';
        } else if (mimeType.startsWith('video/')) {
            return 'warning';
        } else if (mimeType.startsWith('application/') || mimeType.startsWith('text/')) {
            return 'info';
        }
        return '';
    };
    
    const loadMedia = async () => {
        try {
            const response = await fetch('/admin/api/media?page=' + pagination.value.page + '&per_page=' + pagination.value.pageSize);
            const data = await response.json();
            mediaFiles.value = data.media || [];
            pagination.value.total = data.total || 0;
        } catch (error) {
            ElMessage.error('加载媒体列表失败');
            console.error(error);
        }
    };
    
    const searchMedia = async () => {
        try {
            let url = '/admin/api/media?page=' + pagination.value.page + '&per_page=' + pagination.value.pageSize;
            if (searchForm.value.keyword) {
                url += '&keyword=' + encodeURIComponent(searchForm.value.keyword);
            }
            if (searchForm.value.type) {
                url += '&type=' + searchForm.value.type;
            }
            const response = await fetch(url);
            const data = await response.json();
            mediaFiles.value = data.media || [];
            pagination.value.total = data.total || 0;
        } catch (error) {
            ElMessage.error('搜索媒体失败');
            console.error(error);
        }
    };
    
    const resetSearch = () => {
        searchForm.value = {
            keyword: '',
            type: ''
        };
        loadMedia();
    };
    
    const handleSelectionChange = (selection) => {
        selectedMedia.value = selection;
    };
    
    const showUploadDialog = () => {
        uploadDialogVisible.value = true;
    };
    
    const beforeUpload = (file) => {
        const isLt10M = file.size / 1024 / 1024 < 10;
        if (!isLt10M) {
            ElMessage.error('上传文件大小不能超过 10MB!');
        }
        return isLt10M;
    };
    
    const handleUploadSuccess = (response, file) => {
        ElMessage.success('文件上传成功');
        loadMedia();
    };
    
    const handleUploadError = (error, file) => {
        ElMessage.error('文件上传失败');
        console.error(error);
    };
    
    const previewMedia = (media) => {
        previewUrl.value = media.url;
        previewType.value = media.type;
        previewDialogVisible.value = true;
    };
    
    const deleteMedia = async (media) => {
        try {
            await ElMessageBox.confirm(
                `确定要删除文件"${media.name}"吗？`,
                '删除后无法恢复',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }
            );
            
            const response = await fetch(`/admin/api/media/${media.id}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                ElMessage.success('删除成功');
                await loadMedia();
            } else {
                ElMessage.error('删除失败');
            }
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('删除失败');
                console.error(error);
            }
        }
    };
    
    const handleSizeChange = (size) => {
        pagination.value.pageSize = size;
        loadMedia();
    };
    
    const handleCurrentChange = (page) => {
        pagination.value.page = page;
        loadMedia();
    };
    
    const batchDelete = async () => {
        try {
            await ElMessageBox.confirm(
                `确定要删除选中的 ${selectedMedia.value.length} 个文件吗？`,
                '批量删除后无法恢复',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }
            );
            
            for (const media of selectedMedia.value) {
                await fetch(`/admin/api/media/${media.id}`, {
                    method: 'DELETE'
                });
            }
            
            ElMessage.success('批量删除成功');
            selectedMedia.value = [];
            await loadMedia();
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('批量删除失败');
                console.error(error);
            }
        }
    };
    
    onMounted(() => {
        loadMedia();
    });
</script>
