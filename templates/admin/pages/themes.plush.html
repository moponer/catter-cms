<div class="themes-container">
    <el-row :gutter="20">
        <el-col :span="24">
            <el-card shadow="hover">
                <template #header>
                    <div class="card-header">
                        <i>🎨</i>
                        <span>主题管理</span>
                        <el-button type="primary" size="small" icon="el-icon-plus" @click="createTheme">
                            创建主题
                        </el-button>
                    </div>
                </template>
                <div class="card-body">
                    <el-form :inline="true" :model="searchForm">
                        <el-form-item label="搜索">
                            <el-input v-model="searchForm.keyword" placeholder="请输入主题名称" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="状态">
                            <el-select v-model="searchForm.status" placeholder="请选择状态" clearable>
                                <el-option label="全部" value=""></el-option>
                                <el-option label="已启用" value="active"></el-option>
                                <el-option label="已禁用" value="inactive"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" icon="el-icon-search" @click="searchThemes">搜索</el-button>
                            <el-button icon="el-icon-refresh" @click="resetSearch">重置</el-button>
                        </el-form-item>
                    </el-form>
                    
                    <el-table 
                        :data="themes" 
                        style="width: 100%"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column prop="name" label="主题名称" min-width="150"></el-table-column>
                        <el-table-column prop="version" label="版本" width="100"></el-table-column>
                        <el-table-column prop="author" label="作者" width="120"></el-table-column>
                        <el-table-column prop="description" label="描述" min-width="200"></el-table-column>
                        <el-table-column prop="is_active" label="状态" width="100">
                            <template #default="scope">
                                <el-tag :type="scope.row.is_active ? 'success' : 'info'">
                                    {{ scope.row.is_active ? '已启用' : '已禁用' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="created_at" label="创建时间" width="180">
                            <template #default="scope">
                                {{ formatDate(scope.row.created_at) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="300" fixed="right">
                            <template #default="scope">
                                <el-button type="primary" size="small" icon="el-icon-view" @click="previewTheme(scope.row)">
                                    预览
                                </el-button>
                                <el-button type="success" size="small" icon="el-icon-check" @click="activateTheme(scope.row)" v-if="!scope.row.is_active">
                                    启用
                                </el-button>
                                <el-button type="warning" size="small" icon="el-icon-close" @click="deactivateTheme(scope.row)" v-if="scope.row.is_active">
                                    禁用
                                </el-button>
                                <el-button type="primary" size="small" icon="el-icon-edit" @click="editTheme(scope.row)">
                                    编辑配置
                                </el-button>
                                <el-button type="danger" size="small" icon="el-icon-delete" @click="deleteTheme(scope.row)">
                                    删除
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                    
                    <el-pagination
                        v-model:current-page="pagination.page"
                        v-model:page-size="pagination.pageSize"
                        :total="pagination.total"
                        :page-sizes="[10, 20, 50, 100]"
                        layout="total, sizes, prev, pager, next, jumper"
                        @size-change="handleSizeChange"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                    
                    <div class="batch-actions" v-if="selectedThemes.length > 0">
                        <el-button type="danger" icon="el-icon-delete" @click="batchDelete">
                            批量删除 ({{ selectedThemes.length }})
                        </el-button>
                        <el-button type="success" icon="el-icon-check" @click="batchActivate">
                            批量启用 ({{ selectedThemes.length }})
                        </el-button>
                        <el-button type="warning" icon="el-icon-close" @click="batchDeactivate">
                            批量禁用 ({{ selectedThemes.length }})
                        </el-button>
                    </div>
                </div>
            </el-card>
        </el-col>
    </el-row>
    
    <el-dialog v-model="previewDialogVisible" title="主题预览" width="80%" @close="previewDialogVisible = false">
        <div class="preview-container">
            <iframe :src="previewUrl" width="100%" height="600px" frameborder="0"></iframe>
        </div>
    </el-dialog>
    
    <el-dialog v-model="editDialogVisible" title="编辑主题配置" width="70%" @close="editDialogVisible = false">
        <el-form :model="editForm" label-width="120px">
            <el-divider>基本信息</el-divider>
            <el-form-item label="主题名称">
                <el-input v-model="editForm.name" placeholder="请输入主题名称" disabled></el-input>
            </el-form-item>
            <el-form-item label="主题描述">
                <el-input v-model="editForm.description" type="textarea" placeholder="请输入主题描述" disabled></el-input>
            </el-form-item>
            
            <el-divider>颜色配置</el-divider>
            <el-form-item label="主色调">
                <el-color-picker v-model="editForm.primaryColor" show-alpha></el-color-picker>
            </el-form-item>
            <el-form-item label="辅助色">
                <el-color-picker v-model="editForm.secondaryColor" show-alpha></el-color-picker>
            </el-form-item>
            <el-form-item label="背景色">
                <el-color-picker v-model="editForm.backgroundColor" show-alpha></el-color-picker>
            </el-form-item>
            <el-form-item label="文字颜色">
                <el-color-picker v-model="editForm.textColor" show-alpha></el-color-picker>
            </el-form-item>
            <el-form-item label="边框颜色">
                <el-color-picker v-model="editForm.borderColor" show-alpha></el-color-picker>
            </el-form-item>
            
            <el-divider>SEO配置</el-divider>
            <el-form-item label="SEO标题">
                <el-input v-model="editForm.seoTitle" placeholder="请输入SEO标题"></el-input>
            </el-form-item>
            <el-form-item label="SEO描述">
                <el-input v-model="editForm.seoDescription" type="textarea" placeholder="请输入SEO描述"></el-input>
            </el-form-item>
            <el-form-item label="SEO关键词">
                <el-input v-model="editForm.seoKeywords" placeholder="请输入SEO关键词，用逗号分隔"></el-input>
            </el-form-item>
            
            <el-divider>自定义代码</el-divider>
            <el-form-item label="自定义CSS">
                <el-input v-model="editForm.customCss" type="textarea" :rows="6" placeholder="请输入自定义CSS代码"></el-input>
            </el-form-item>
            <el-form-item label="自定义JS">
                <el-input v-model="editForm.customJs" type="textarea" :rows="6" placeholder="请输入自定义JavaScript代码"></el-input>
            </el-form-item>
            
            <el-form-item label="菜单配置">
                <el-input v-model="editForm.menuConfig" type="textarea" :rows="8" placeholder="菜单配置（JSON格式）" disabled></el-input>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="editDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="saveThemeConfig">保存</el-button>
        </template>
    </el-dialog>
</div>

<style>
    .themes-container {
        padding: 20px;
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .batch-actions {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #ebeef5;
    }
    .preview-container {
        background: #f5f7fa;
        border-radius: 8px;
        padding: 20px;
    }
</style>

<script>
    const { ref, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;
    
    const themes = ref([]);
    const selectedThemes = ref([]);
    const searchForm = ref({
        keyword: '',
        status: ''
    });
    
    const previewDialogVisible = ref(false);
    const previewUrl = ref('');
    const editDialogVisible = ref(false);
    const editForm = ref({
        name: '',
        description: '',
        primaryColor: '#3B82F6',
        secondaryColor: '#764ba2',
        backgroundColor: '#f5f7fa',
        textColor: '#1f2937',
        borderColor: '#e5e7eb',
        menuConfig: '',
        customCss: '',
        customJs: '',
        seoTitle: '',
        seoDescription: '',
        seoKeywords: ''
    });
    const currentThemeSlug = ref('');
    
    const pagination = ref({
        page: 1,
        pageSize: 10,
        total: 0
    });
    
    const formatDate = (date) => {
        return new Date(date).toLocaleString('zh-CN');
    };
    
    const loadThemes = async () => {
        try {
            const response = await fetch('/admin/api/themes?page=' + pagination.value.page + '&per_page=' + pagination.value.pageSize);
            const data = await response.json();
            themes.value = data.themes || [];
            pagination.value.total = data.total || 0;
        } catch (error) {
            ElMessage.error('加载主题列表失败');
            console.error(error);
        }
    };
    
    const searchThemes = async () => {
        try {
            let url = '/admin/api/themes?page=' + pagination.value.page + '&per_page=' + pagination.value.pageSize;
            if (searchForm.value.keyword) {
                url += '&keyword=' + encodeURIComponent(searchForm.value.keyword);
            }
            if (searchForm.value.status) {
                url += '&status=' + searchForm.value.status;
            }
            const response = await fetch(url);
            const data = await response.json();
            themes.value = data.themes || [];
            pagination.value.total = data.total || 0;
        } catch (error) {
            ElMessage.error('搜索主题失败');
            console.error(error);
        }
    };
    
    const resetSearch = () => {
        searchForm.value = {
            keyword: '',
            status: ''
        };
        loadThemes();
    };
    
    const handleSelectionChange = (selection) => {
        selectedThemes.value = selection;
    };
    
    const previewTheme = (theme) => {
        previewUrl.value = `/themes/${theme.slug}/preview`;
        previewDialogVisible.value = true;
    };
    
    const activateTheme = async (theme) => {
        try {
            await ElMessageBox.confirm(
                `确定要启用主题"${theme.name}"吗？`,
                '启用后前台将使用该主题',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'success'
                }
            );
            
            const response = await fetch(`/admin/api/themes/${theme.id}/activate`, {
                method: 'POST'
            });
            
            if (response.ok) {
                ElMessage.success('主题启用成功');
                await loadThemes();
            } else {
                ElMessage.error('主题启用失败');
            }
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('主题启用失败');
                console.error(error);
            }
        }
    };
    
    const deactivateTheme = async (theme) => {
        try {
            await ElMessageBox.confirm(
                `确定要禁用主题"${theme.name}"吗？`,
                '禁用后前台将不再使用该主题',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }
            );
            
            const response = await fetch(`/admin/api/themes/${theme.id}/deactivate`, {
                method: 'POST'
            });
            
            if (response.ok) {
                ElMessage.success('主题禁用成功');
                await loadThemes();
            } else {
                ElMessage.error('主题禁用失败');
            }
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('主题禁用失败');
                console.error(error);
            }
        }
    };
    
    const editTheme = async (theme) => {
        currentThemeSlug.value = theme.slug;
        try {
            const response = await fetch(`/admin/api/themes/${theme.slug}/config`);
            const data = await response.json();
            
            if (data.config) {
                editForm.value = {
                    name: data.config.name || theme.name,
                    description: data.config.description || theme.description,
                    primaryColor: data.config.config?.primaryColor || '#3B82F6',
                    secondaryColor: data.config.config?.secondaryColor || '#764ba2',
                    backgroundColor: data.config.config?.backgroundColor || '#f5f7fa',
                    textColor: data.config.config?.textColor || '#1f2937',
                    borderColor: data.config.config?.borderColor || '#e5e7eb',
                    menuConfig: JSON.stringify(data.config.config?.menus || {}, null, 2),
                    customCss: data.config.config?.custom?.css || '',
                    customJs: data.config.config?.custom?.js || '',
                    seoTitle: data.config.config?.seo?.title || '',
                    seoDescription: data.config.config?.seo?.description || '',
                    seoKeywords: data.config.config?.seo?.keywords || ''
                };
            }
            
            editDialogVisible.value = true;
        } catch (error) {
            ElMessage.error('加载主题配置失败');
            console.error(error);
        }
    };
    
    const saveThemeConfig = async () => {
        try {
            const configData = {
                primary_color: editForm.value.primaryColor,
                secondary_color: editForm.value.secondaryColor,
                background_color: editForm.value.backgroundColor,
                text_color: editForm.value.textColor,
                border_color: editForm.value.borderColor,
                custom_css: editForm.value.customCss,
                custom_js: editForm.value.customJs,
                seo_title: editForm.value.seoTitle,
                seo_description: editForm.value.seoDescription,
                seo_keywords: editForm.value.seoKeywords
            };
            
            const response = await fetch(`/admin/api/themes/${currentThemeSlug.value}/config`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(configData)
            });
            
            if (response.ok) {
                ElMessage.success('主题配置保存成功');
                editDialogVisible.value = false;
            } else {
                ElMessage.error('主题配置保存失败');
            }
        } catch (error) {
            ElMessage.error('主题配置保存失败');
            console.error(error);
        }
    };
    
    const deleteTheme = async (theme) => {
        try {
            await ElMessageBox.confirm(
                `确定要删除主题"${theme.name}"吗？`,
                '删除后无法恢复',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }
            );
            
            const response = await fetch(`/admin/api/themes/${theme.id}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                ElMessage.success('删除成功');
                await loadThemes();
            } else {
                ElMessage.error('删除失败');
            }
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('删除失败');
                console.error(error);
            }
        }
    };
    
    const createTheme = () => {
        window.location.href = '/admin/themes/new';
    };
    
    const handleSizeChange = (size) => {
        pagination.value.pageSize = size;
        loadThemes();
    };
    
    const handleCurrentChange = (page) => {
        pagination.value.page = page;
        loadThemes();
    };
    
    const batchDelete = async () => {
        try {
            await ElMessageBox.confirm(
                `确定要删除选中的 ${selectedThemes.value.length} 个主题吗？`,
                '批量删除后无法恢复',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }
            );
            
            for (const theme of selectedThemes.value) {
                await fetch(`/admin/api/themes/${theme.id}`, {
                    method: 'DELETE'
                });
            }
            
            ElMessage.success('批量删除成功');
            selectedThemes.value = [];
            await loadThemes();
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('批量删除失败');
                console.error(error);
            }
        }
    };
    
    const batchActivate = async () => {
        try {
            await ElMessageBox.confirm(
                `确定要启用选中的 ${selectedThemes.value.length} 个主题吗？`,
                '启用后将覆盖当前激活主题',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'success'
                }
            );
            
            for (const theme of selectedThemes.value) {
                await fetch(`/admin/api/themes/${theme.id}/activate`, {
                    method: 'POST'
                });
            }
            
            ElMessage.success('批量启用成功');
            selectedThemes.value = [];
            await loadThemes();
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('批量启用失败');
                console.error(error);
            }
        }
    };
    
    const batchDeactivate = async () => {
        try {
            await ElMessageBox.confirm(
                `确定要禁用选中的 ${selectedThemes.value.length} 个主题吗？`,
                '禁用后将恢复默认主题',
                {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }
            );
            
            for (const theme of selectedThemes.value) {
                await fetch(`/admin/api/themes/${theme.id}/deactivate`, {
                    method: 'POST'
                });
            }
            
            ElMessage.success('批量禁用成功');
            selectedThemes.value = [];
            await loadThemes();
        } catch (error) {
            if (error !== 'cancel') {
                ElMessage.error('批量禁用失败');
                console.error(error);
            }
        }
    };
    
    onMounted(() => {
        loadThemes();
    });
</script>
