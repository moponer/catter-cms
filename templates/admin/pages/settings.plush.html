<div class="settings-container">
    <el-row :gutter="20">
        <el-col :span="24">
            <el-card shadow="hover">
                <template #header>
                    <div class="card-header">
                        <i>⚙️</i>
                        <span>系统设置</span>
                    </div>
                </template>
                <div class="card-body">
                    <el-tabs v-model="activeTab" type="border-card">
                        <el-tab-pane label="基本信息" name="basic">
                            <el-form :model="settings.basic" label-width="120px" style="max-width: 800px;">
                                <el-form-item label="网站名称">
                                    <el-input v-model="settings.basic.site_name" placeholder="请输入网站名称"></el-input>
                                </el-form-item>
                                <el-form-item label="网站描述">
                                    <el-input v-model="settings.basic.site_description" type="textarea" :rows="3" placeholder="请输入网站描述"></el-input>
                                </el-form-item>
                                <el-form-item label="网站关键词">
                                    <el-input v-model="settings.basic.site_keywords" placeholder="请输入网站关键词，用逗号分隔"></el-input>
                                </el-form-item>
                                <el-form-item label="联系邮箱">
                                    <el-input v-model="settings.basic.contact_email" placeholder="请输入联系邮箱"></el-input>
                                </el-form-item>
                                <el-form-item label="联系电话">
                                    <el-input v-model="settings.basic.contact_phone" placeholder="请输入联系电话"></el-input>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="saveSettings('basic')">保存设置</el-button>
                                </el-form-item>
                            </el-form>
                        </el-tab-pane>
                        
                        <el-tab-pane label="SEO设置" name="seo">
                            <el-form :model="settings.seo" label-width="120px" style="max-width: 800px;">
                                <el-form-item label="默认标题">
                                    <el-input v-model="settings.seo.default_title" placeholder="请输入默认标题"></el-input>
                                </el-form-item>
                                <el-form-item label="默认描述">
                                    <el-input v-model="settings.seo.default_description" type="textarea" :rows="3" placeholder="请输入默认描述"></el-input>
                                </el-form-item>
                                <el-form-item label="默认关键词">
                                    <el-input v-model="settings.seo.default_keywords" placeholder="请输入默认关键词，用逗号分隔"></el-input>
                                </el-form-item>
                                <el-form-item label="作者信息">
                                    <el-input v-model="settings.seo.author" placeholder="请输入作者信息"></el-input>
                                </el-form-item>
                                <el-form-item label="robots.txt">
                                    <el-input v-model="settings.seo.robots" type="textarea" :rows="6" placeholder="请输入robots.txt内容"></el-input>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="saveSettings('seo')">保存设置</el-button>
                                </el-form-item>
                            </el-form>
                        </el-tab-pane>
                        
                        <el-tab-pane label="邮件设置" name="email">
                            <el-form :model="settings.email" label-width="120px" style="max-width: 800px;">
                                <el-form-item label="SMTP服务器">
                                    <el-input v-model="settings.email.smtp_host" placeholder="请输入SMTP服务器地址"></el-input>
                                </el-form-item>
                                <el-form-item label="SMTP端口">
                                    <el-input v-model="settings.email.smtp_port" type="number" placeholder="请输入SMTP端口"></el-input>
                                </el-form-item>
                                <el-form-item label="发件人邮箱">
                                    <el-input v-model="settings.email.from_email" placeholder="请输入发件人邮箱"></el-input>
                                </el-form-item>
                                <el-form-item label="发件人名称">
                                    <el-input v-model="settings.email.from_name" placeholder="请输入发件人名称"></el-input>
                                </el-form-item>
                                <el-form-item label="用户名">
                                    <el-input v-model="settings.email.username" placeholder="请输入SMTP用户名"></el-input>
                                </el-form-item>
                                <el-form-item label="密码">
                                    <el-input v-model="settings.email.password" type="password" placeholder="请输入SMTP密码" show-password></el-input>
                                </el-form-item>
                                <el-form-item label="使用SSL">
                                    <el-switch v-model="settings.email.use_ssl"></el-switch>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="saveSettings('email')">保存设置</el-button>
                                    <el-button @click="testEmail">测试邮件</el-button>
                                </el-form-item>
                            </el-form>
                        </el-tab-pane>
                        
                        <el-tab-pane label="主题设置" name="theme">
                            <el-form :model="settings.theme" label-width="120px" style="max-width: 800px;">
                                <el-form-item label="当前主题">
                                    <el-select v-model="settings.theme.active_theme" placeholder="请选择主题">
                                        <el-option label="Catter Blog" value="catter-blog"></el-option>
                                        <el-option label="Catter CMS Official" value="catter-cms-official"></el-option>
                                        <el-option label="Enterprise Website" value="enterprise-website"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="saveSettings('theme')">保存设置</el-button>
                                </el-form-item>
                            </el-form>
                        </el-tab-pane>
                        
                        <el-tab-pane label="系统设置" name="system">
                            <el-form :model="settings.system" label-width="120px" style="max-width: 800px;">
                                <el-form-item label="时区">
                                    <el-select v-model="settings.system.timezone" placeholder="请选择时区">
                                        <el-option label="Asia/Shanghai" value="Asia/Shanghai"></el-option>
                                        <el-option label="Asia/Hong_Kong" value="Asia/Hong_Kong"></el-option>
                                        <el-option label="Asia/Tokyo" value="Asia/Tokyo"></el-option>
                                        <el-option label="UTC" value="UTC"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item label="语言">
                                    <el-select v-model="settings.system.language" placeholder="请选择语言">
                                        <el-option label="简体中文" value="zh-CN"></el-option>
                                        <el-option label="繁体中文" value="zh-TW"></el-option>
                                        <el-option label="English" value="en-US"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item label="每页显示">
                                    <el-input v-model="settings.system.per_page" type="number" placeholder="请输入每页显示数量"></el-input>
                                </el-form-item>
                                <el-form-item label="允许注册">
                                    <el-switch v-model="settings.system.allow_register"></el-switch>
                                </el-form-item>
                                <el-form-item label="需要审核">
                                    <el-switch v-model="settings.system.require_moderation"></el-switch>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="saveSettings('system')">保存设置</el-button>
                                </el-form-item>
                            </el-form>
                        </el-tab-pane>
                    </el-tabs>
                </div>
            </el-card>
        </el-col>
    </el-row>
</div>

<style>
    .settings-container {
        padding: 20px;
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>

<script>
    const { ref, onMounted } = Vue;
    const { ElMessage } = ElementPlus;
    
    const activeTab = ref('basic');
    const settings = ref({
        basic: {
            site_name: '',
            site_description: '',
            site_keywords: '',
            contact_email: '',
            contact_phone: ''
        },
        seo: {
            default_title: '',
            default_description: '',
            default_keywords: '',
            author: '',
            robots: ''
        },
        email: {
            smtp_host: '',
            smtp_port: 587,
            from_email: '',
            from_name: '',
            username: '',
            password: '',
            use_ssl: true
        },
        theme: {
            active_theme: 'catter-blog'
        },
        system: {
            timezone: 'Asia/Shanghai',
            language: 'zh-CN',
            per_page: 10,
            allow_register: false,
            require_moderation: false
        }
    });
    
    const loadSettings = async () => {
        try {
            const response = await fetch('/admin/api/settings');
            const data = await response.json();
            if (data.settings) {
                settings.value = data.settings;
            }
        } catch (error) {
            ElMessage.error('加载设置失败');
            console.error(error);
        }
    };
    
    const saveSettings = async (category) => {
        try {
            const response = await fetch('/admin/api/settings', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    category: category,
                    settings: settings.value[category]
                })
            });
            
            if (response.ok) {
                ElMessage.success('设置保存成功');
            } else {
                ElMessage.error('设置保存失败');
            }
        } catch (error) {
            ElMessage.error('设置保存失败');
            console.error(error);
        }
    };
    
    const testEmail = async () => {
        try {
            const response = await fetch('/admin/api/settings/test-email', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(settings.value.email)
            });
            
            if (response.ok) {
                ElMessage.success('测试邮件发送成功');
            } else {
                ElMessage.error('测试邮件发送失败');
            }
        } catch (error) {
            ElMessage.error('测试邮件发送失败');
            console.error(error);
        }
    };
    
    onMounted(() => {
        loadSettings();
    });
</script>
