<div class="users-container">
    <el-row :gutter="20">
        <el-col :span="24">
            <el-card shadow="hover">
                <template #header>
                    <div class="card-header">
                        <i>👥</i>
                        <span>用户管理</span>
                        <el-button type="primary" size="small" icon="el-icon-plus" @click="createUser">
                            添加用户
                        </el-button>
                    </div>
                </template>
                <div class="card-body">
                    <el-form :inline="true" :model="searchForm">
                        <el-form-item label="搜索">
                            <el-input v-model="searchForm.keyword" placeholder="请输入用户名或邮箱" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="角色">
                            <el-select v-model="searchForm.role" placeholder="请选择角色" clearable>
                                <el-option label="全部" value=""></el-option>
                                <el-option label="管理员" value="admin"></el-option>
                                <el-option label="编辑者" value="editor"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" icon="el-icon-search" @click="searchUsers">搜索</el-button>
                            <el-button icon="el-icon-refresh" @click="resetSearch">重置</el-button>
                        </el-form-item>
                    </el-form>
                    
                    <el-table 
                        :data="users" 
                        style="width: 100%"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column prop="name" label="用户名" min-width="120"></el-table-column>
                        <el-table-column prop="email" label="邮箱" min-width="200"></el-table-column>
                        <el-table-column prop="role" label="角色" width="120">
                            <template #default="scope">
                                <el-tag :type="getRoleType(scope.row.role)">
                                    {{ getRoleText(scope.row.role) }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="created_at" label="创建时间" width="180">
                            <template #default="scope">
                                {{ formatDate(scope.row.created_at) }}
                            </template>
                        </el-table-column>
                        <el-table-column prop="updated_at" label="更新时间" width="180">
                            <template #default="scope">
                                {{ formatDate(scope.row.updated_at) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="250" fixed="right">
                            <template #default="scope">
                                <el-button type="primary" size="small" icon="el-icon-edit" @click="editUser(scope.row)">
                                    编辑
                                </el-button>
                                <el-button type="danger" size="small" icon="el-icon-delete" @click="deleteUser(scope.row)">
                                    删除
                                </el-button>
                                <el-dropdown @command="handleUserCommand(scope.row)">
                                    <el-button type="info" size="small">
                                        更多<el-icon class="el-icon--right"></el-icon>
                                    </el-button>
                                    <template #dropdown>
                                        <el-dropdown-menu>
                                            <el-dropdown-item icon="el-icon-lock" @click="resetPassword(scope.row)">
                                                重置密码
                                            </el-dropdown-item>
                                            <el-dropdown-item icon="el-icon-unlock" @click="changeRole(scope.row)">
                                                修改角色
                                            </el-dropdown-item>
                                            <el-dropdown-item icon="el-icon-warning" @click="disableUser(scope.row)">
                                                禁用账号
                                            </el-dropdown-item>
                                        </el-dropdown-menu>
                                    </template>
                                </el-dropdown>
                            </template>
                        </el-table-column>
                    </el-table>
                    
                    <el-pagination
                        v-model:current-page="pagination.page"
                        v-model:page-size="pagination.pageSize"
                        :total="pagination.total"
                        :page-sizes="[10, 20, 50, 100]"
                        layout="total, sizes, prev, pager, next, jumper"
                        @size-change="handleSizeChange"
                        @current-change="handleCurrentChange">
                    </el-pagination>
                </div>
            </el-card>
        </el-col>
    </el-row>
</div>

<style>
    .users-container {
        padding: 20px;
    }
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>

<script>
    const { ref } = Vue;
    const { ElTable, ElTag, ElMessage, ElMessageBox, ElDropdown, ElDropdownMenu, ElDropdownItem } = ElementPlus;
    
    const users = ref([
        {
            id: 1,
            name: 'admin',
            email: 'admin@example.com',
            role: 'admin',
            created_at: '2024-03-12 10:00:00',
            updated_at: '2024-03-12 10:00:00'
        },
        {
            id: 2,
            name: 'editor',
            email: 'editor@example.com',
            role: 'editor',
            created_at: '2024-03-12 11:00:00',
            updated_at: '2024-03-12 11:00:00'
        }
    ]);
    
    const selectedUsers = ref([]);
    const searchForm = ref({
        keyword: '',
        role: ''
    });
    
    const pagination = ref({
        page: 1,
        pageSize: 10,
        total: 2
    });
    
    const getRoleType = (role) => {
        const roleMap = {
            'admin': 'danger',
            'editor': 'success',
            'user': 'info'
        };
        return roleMap[role] || 'info';
    };
    
    const getRoleText = (role) => {
        const roleMap = {
            'admin': '管理员',
            'editor': '编辑者',
            'user': '普通用户'
        };
        return roleMap[role] || role;
    };
    
    const formatDate = (date) => {
        return new Date(date).toLocaleString('zh-CN');
    };
    
    const createUser = () => {
        window.location.href = '/admin/users/new';
    };
    
    const editUser = (user) => {
        window.location.href = `/admin/users/${user.id}/edit`;
    };
    
    const deleteUser = (user) => {
        ElMessageBox.confirm(
            '确定要删除这个用户吗？',
            '删除后无法恢复',
            {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
            }
        ).then(() => {
            ElMessage.success('删除成功');
        }).catch(() => {
            ElMessage.info('已取消删除');
        });
    };
    
    const resetPassword = (user) => {
        ElMessageBox.confirm(
            `确定要重置用户 ${user.name} 的密码吗？`,
            '重置后用户需要重新登录',
            {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'info'
            }
        ).then(() => {
            ElMessage.success('密码重置成功');
        }).catch(() => {
            ElMessage.info('已取消重置');
        });
    };
    
    const changeRole = (user) => {
        ElMessageBox.confirm(
            `确定要修改用户 ${user.name} 的角色吗？`,
            '修改角色后用户权限将发生变化',
            {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
            }
        ).then(() => {
            ElMessage.success('角色修改成功');
        }).catch(() => {
            ElMessage.info('已取消修改');
        });
    };
    
    const disableUser = (user) => {
        ElMessageBox.confirm(
            `确定要禁用用户 ${user.name} 的账号吗？`,
            '禁用后用户将无法登录',
            {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
            }
        ).then(() => {
            ElMessage.success('账号已禁用');
        }).catch(() => {
            ElMessage.info('已取消禁用');
        });
    };
    
    const handleSelectionChange = (selection) => {
        selectedUsers.value = selection;
    };
    
    const searchUsers = () => {
        ElMessage.success('搜索功能开发中');
    };
    
    const resetSearch = () => {
        searchForm.value = {
            keyword: '',
            role: ''
        };
        ElMessage.success('已重置搜索条件');
    };
    
    const handleSizeChange = (size) => {
        pagination.value.pageSize = size;
        ElMessage.success(`每页显示 ${size} 条`);
    };
    
    const handleCurrentChange = (page) => {
        pagination.value.page = page;
        ElMessage.success(`当前第 ${page} 页`);
    };
    
    const handleUserCommand = (command) => {
        ElMessage.success(`执行操作: ${command}`);
    };
</script>
