<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catter CMS - 管理后台</title>
    <link rel="stylesheet" href="/assets/element-plus/element-plus.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
        }
        #admin-app {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #304156;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            background-color: #f0f2f5;
        }
        .logo {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #4b5563;
        }
        .menu {
            flex: 1;
            padding: 10px 0;
        }
        .menu-item {
            padding: 12px 20px;
            color: #bfcbd9;
            text-decoration: none;
            display: block;
            transition: all 0.3s;
        }
        .menu-item:hover, .menu-item.active {
            background-color: #4b5563;
            color: #fff;
        }
        .menu-item i {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="admin-app">
        <div class="sidebar">
            <div class="logo">Catter CMS</div>
            <div class="menu">
                <a href="/admin/" class="menu-item active">
                    <i>📊</i> 仪表盘
                </a>
                <a href="/admin/posts" class="menu-item">
                    <i>📝</i> 文章管理
                </a>
                <a href="/admin/users" class="menu-item">
                    <i>👥</i> 用户管理
                </a>
                <a href="/admin/media" class="menu-item">
                    <i>🖼️</i> 媒体库
                </a>
                <a href="/admin/themes" class="menu-item">
                    <i>🎨</i> 主题管理
                </a>
                <a href="/admin/settings" class="menu-item">
                    <i>⚙️</i> 系统设置
                </a>
                <a href="/admin/logout" class="menu-item">
                    <i>🚪</i> 退出登录
                </a>
            </div>
        </div>
        <div class="main-content">
            <%= yield %>
        </div>
    </div>
    
    <script src="/assets/element-plus/vue.global.prod.js"></script>
    <script src="/assets/element-plus/element-plus.js"></script>
    <script>
        const { createApp, ref } = Vue;
        const { ElMessage } = ElementPlus;
        
        const app = createApp({
            setup() {
                const activeMenu = ref(window.location.pathname);
                
                return {
                    activeMenu
                };
            }
        });
        
        app.use(ElementPlus);
        app.mount('#admin-app');
    </script>
</body>
</html>
