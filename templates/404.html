<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | Catter CMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .error-card {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #409eff;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #303133;
            margin-top: 15px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #409eff;
            line-height: 1;
            margin: 20px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .error-title {
            font-size: 28px;
            color: #303133;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .error-message {
            font-size: 16px;
            color: #606266;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #409eff;
            color: white;
            box-shadow: 0 2px 8px rgba(64, 158, 255, 0.3);
        }

        .btn-primary:hover {
            background: #66b1ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.4);
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #606266;
            border: 1px solid #dcdfe6;
        }

        .btn-secondary:hover {
            background: #ecf5ff;
            color: #409eff;
            border-color: #409eff;
            transform: translateY(-2px);
        }

        .illustration {
            margin: 30px 0;
            font-size: 80px;
            opacity: 0.8;
        }

        .footer {
            margin-top: 30px;
            color: #909399;
            font-size: 14px;
        }

        .footer a {
            color: #409eff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 40px 25px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 22px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-card">
            <div class="logo">
                <div class="logo-icon">🐱</div>
                <div class="logo-text">Catter CMS</div>
            </div>

            <div class="illustration">🔍</div>

            <div class="error-code">404</div>

            <h1 class="error-title">页面未找到</h1>

            <p class="error-message">
                抱歉，您访问的页面不存在或已被移除。<br>
                请检查网址是否正确，或返回首页继续浏览。
            </p>

            <div class="actions">
                <a href="/" class="btn btn-primary">返回首页</a>
                <a href="javascript:history.back()" class="btn btn-secondary">返回上一页</a>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2024 Catter CMS. All rights reserved.</p>
            <p style="margin-top: 8px;">
                <a href="/admin">管理后台</a>
            </p>
        </div>
    </div>
</body>
</html>
